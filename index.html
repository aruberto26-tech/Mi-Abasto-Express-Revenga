        // PERSISTENCIA PERMANENTE DE SESIÓN DEL CLIENTE (LocalStorage + Respaldo Cookie)
        // ============================================================================
        const SESSION_STORAGE_KEY = 'abasto_cliente_ci_permanente_v1';

        function guardarSesionClientePermanente(cedula) {
          if (!cedula) return;
          const ciLimpia = String(cedula).trim().toUpperCase();
          try {
            window.localStorage.setItem(SESSION_STORAGE_KEY, ciLimpia);
            document.cookie = `abasto_cliente_ci=${encodeURIComponent(ciLimpia)}; max-age=31536000; path=/; SameSite=Lax`;
          } catch (e) {
            console.error('Error guardando sesión local:', e);
          }
        }

        function obtenerSesionClienteGuardada() {
          try {
            const localCi = window.localStorage.getItem(SESSION_STORAGE_KEY);
            if (localCi) return localCi.trim().toUpperCase();

            const match = document.cookie.match(new RegExp('(^| )abasto_cliente_ci=([^;]+)'));
            if (match && match[2]) {
              const cookieCi = decodeURIComponent(match[2]).trim().toUpperCase();
              window.localStorage.setItem(SESSION_STORAGE_KEY, cookieCi);
              return cookieCi;
            }
          } catch (e) {
            console.error('Error leyendo sesión local:', e);
          }
          return null;
        }

        function cerrarSesionClientePermanente() {
          try {
            window.localStorage.removeItem(SESSION_STORAGE_KEY);
            document.cookie = 'abasto_cliente_ci=; max-age=0; path=/;';
          } catch (e) {
            console.error('Error cerrando sesión local:', e);
          }
        }

        const formatBs = (val) =>

            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })}`;

        const round3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;

        // saleMode: 'UNIT' | 'WEIGHT' (Kg/g) | 'VOLUME' (Lt/mL)
        function getProductSaleMode(p) {
          if (p?.saleMode === 'WEIGHT' || p?.saleMode === 'VOLUME' || p?.saleMode === 'UNIT') {
            return p.saleMode;
          }
          const u = String(p?.unit || '').toLowerCase();
          if (u === 'kilogramo' || u === 'kg' || u.includes('por kg')) return 'WEIGHT';
          if (u === 'litro' || u === 'lt' || u.includes('por lt') || u.includes('por litro')) return 'VOLUME';
          return 'UNIT';
        }

        function formatMeasureQty(qty, saleMode) {
          const q = round3(qty);
          if (saleMode === 'WEIGHT') {
            if (q < 1) return `${Math.round(q * 1000)}g`;
            return `${q.toFixed(q % 1 === 0 ? 0 : 3).replace(/\.?0+$/, '')} Kg`;
          }
          if (saleMode === 'VOLUME') {
            if (q < 1) return `${Math.round(q * 1000)}mL`;
            return `${q.toFixed(q % 1 === 0 ? 0 : 3).replace(/\.?0+$/, '')} Lt`;
          }
          return `${q} und`;
        }

        function formatBasePriceLabel(saleMode) {
          if (saleMode === 'WEIGHT') return 'x 1 Kg';
          if (saleMode === 'VOLUME') return 'x 1 Lt';
          return 'c/u';
        }

        function compressImageFile(file, maxWidth = 520, quality = 0.80) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
            reader.onload = (event) => {
              const img = new Image();
              img.onerror = () => reject(new Error('Imagen no válida'));
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                resolve(dataUrl);
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          });
        }

            const existsInMain = customers.some((c) => c.ci === currentUserCi);
            if (!existsInMain && db) {
              getDoc(doc(db, 'clientes', currentUserCi))
                .then((snap) => {
                  if (snap.exists()) {
                    const recovered = snap.data();
                    updateCloud({ customers: [recovered, ...customers] });
                  }
                })
                .catch((err) => console.error('Error recuperando respaldo de cliente:', err));
            }
          }, [isCloudLoaded, currentUserCi]);

          const updateCloud = (updatedFields) => {
            setCloudData((prevCloud) => {
              const baseData = prevCloud || {
                settings: INITIAL_SETTINGS,
                departments: INITIAL_DEPARTMENTS,
                products: INITIAL_PRODUCTS,
                customers: INITIAL_CUSTOMERS,
                sales: INITIAL_SALES,
                cashMovements: INITIAL_CASH_MOVEMENTS,
                staffUsers: INITIAL_STAFF_USERS,
                cashShifts: INITIAL_CASH_SHIFTS,
                suppliers: INITIAL_SUPPLIERS,
                payables: INITIAL_PAYABLES,
                employees: INITIAL_EMPLOYEES,
                coupons: INITIAL_COUPONS,
                fixedExpenses: INITIAL_FIXED_EXPENSES,
                fixedHistory: INITIAL_FIXED_HISTORY,
              };
              const newData = {
                ...baseData,
                ...updatedFields,
              };
              const docRef = doc(db, 'abasto_data', 'main_store');
              setDoc(docRef, newData, { merge: true }).catch((err) =>
                console.error('Error guardando en nube:', err)
              );
              return newData;
            });
          };

          const saveCustomerToCloudAndSession = (customerRecord) => {
            const ciNorm = customerRecord.ci.trim().toUpperCase();
            const recordNorm = { ...customerRecord, ci: ciNorm };

            const exists = customers.some((c) => c.ci === ciNorm);
            const updatedCustomers = exists
              ? customers.map((c) => (c.ci === ciNorm ? recordNorm : c))
              : [recordNorm, ...customers];

            updateCloud({ customers: updatedCustomers });

            setDoc(doc(db, 'clientes', ciNorm), recordNorm, { merge: true }).catch((err) =>
              console.error('Error guardando respaldo individual del cliente:', err)
            );

            setCurrentUserCi(ciNorm);
          };

          const currentUser = useMemo(
            () => customers.find((c) => c.ci === currentUserCi) || null,
            [customers, currentUserCi]
          );

          const enrichedCart = useMemo(() => {
            return cart
              .map((item) => {
                const product = products.find((p) => p.id === item.productId);
                if (!product) return null;
                const saleMode = getProductSaleMode(product);
                const isWholesale = item.qty >= product.wholesaleMinQty;
                const appliedPriceUsd = isWholesale ? product.wholesalePrice : product.retailPrice;
                const regularTotalUsd = product.retailPrice * item.qty;
                const lineTotalUsd = appliedPriceUsd * item.qty;
                const savingsUsd = regularTotalUsd - lineTotalUsd;
                return {
                  ...item,
                  product,
                  saleMode,
                  isWholesale,
                  appliedPriceUsd,
                  lineTotalUsd,
                  savingsUsd,
                  missingForWholesale: isWholesale ? 0 : round3(product.wholesaleMinQty - item.qty),
                };
              })
              .filter(Boolean);
          }, [cart, products]);

          const cartSummary = useMemo(() => {
            const subtotalUsd = enrichedCart.reduce((acc, item) => acc + item.lineTotalUsd, 0);
            const totalSavingsUsd = enrichedCart.reduce((acc, item) => acc + item.savingsUsd, 0);
            const totalItemsCount = enrichedCart.reduce(
              (acc, item) => acc + (item.saleMode === 'UNIT' ? item.qty : 1),
              0
            );
            const qualifiesFreeDelivery = subtotalUsd >= settings.freeDeliveryThreshold;
            const deliveryUsd =
              subtotalUsd === 0 ? 0 : qualifiesFreeDelivery ? 0 : Number(settings.deliveryFee);
            const missingForFreeDelivery = Math.max(0, settings.freeDeliveryThreshold - subtotalUsd);

            let couponDiscountUsd = 0;
            if (appliedCoupon && subtotalUsd >= (appliedCoupon.minOrderUsd || 0)) {
              couponDiscountUsd = round3(subtotalUsd * (appliedCoupon.discountPercent / 100));
            }

            const availableCashbackUsd = round3(Number(currentUser?.cashbackUsd || 0));
            const maxRedeemable = Math.max(0, round3(subtotalUsd + deliveryUsd - couponDiscountUsd));
            const cashbackUsedUsd =
              useCashbackPoints && availableCashbackUsd > 0
                ? Math.min(availableCashbackUsd, maxRedeemable)
                : 0;

            const totalUsd = Math.max(0, round3(subtotalUsd + deliveryUsd - couponDiscountUsd - cashbackUsedUsd));
            const totalBs = totalUsd * settings.exchangeRate;
            const earnedCashbackUsd = round3(totalUsd * 0.02);

            return {
              subtotalUsd,
              totalSavingsUsd,
              totalItemsCount,
              qualifiesFreeDelivery,
              deliveryUsd,
              missingForFreeDelivery,
              couponDiscountUsd,
              availableCashbackUsd,
              cashbackUsedUsd,
              earnedCashbackUsd,
              totalUsd,
              totalBs,
            };
          }, [enrichedCart, settings, appliedCoupon, currentUser, useCashbackPoints]);

          const addToCart = (productId, delta = 1) => {
            const product = products.find((p) => p.id === productId);
            if (!product) return;

            setCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              const currentQty = existing ? existing.qty : 0;
              const newQty = round3(currentQty + delta);

              if (newQty <= 0) {
                return prev.filter((i) => i.productId !== productId);
              }
              if (newQty > product.stock) {
                showToast(`Stock máximo disponible: ${product.stock}`, 'warning');
                return prev;
              }

              if (existing) {
                return prev.map((i) => (i.productId === productId ? { ...i, qty: newQty } : i));
              } else {
                return [...prev, { productId, qty: newQty }];
              }
            });
          };

          const setCartQtyDirect = (productId, qty) => {
            const product = products.find((p) => p.id === productId);
            if (!product) return;
            const cleanQty = round3(qty);
            if (cleanQty <= 0) {
              setCart((prev) => prev.filter((i) => i.productId !== productId));
              return;
            }
            const clampedQty = Math.min(cleanQty, product.stock);
            setCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              if (existing) {
                return prev.map((i) => (i.productId === productId ? { ...i, qty: clampedQty } : i));
              }
              return [...prev, { productId, qty: clampedQty }];
            });
          };

          const handleInitiateCheckout = () => {
            if (enrichedCart.length === 0) return;
            if (!currentUser) {
              setCheckoutAfterAuth(true);
              setIsCartOpen(false);
              setIsProfileModalOpen(true);
              showToast('Por favor regístrate o inicia sesión una sola vez para completar tu pedido', 'info');
              return;
            }
            completeOnlineOrder(currentUser);
          };

          const completeOnlineOrder = (customer) => {
            for (const item of enrichedCart) {
              if (item.qty > item.product.stock) {
                showToast(`Stock insuficiente para ${item.product.name}`, 'error');
                return;
              }
            }

            const totalCostUsd = enrichedCart.reduce(
              (acc, item) => acc + item.product.costPrice * item.qty,
              0
            );

            const hasMeasuredItems = enrichedCart.some(
              (i) => i.saleMode === 'WEIGHT' || i.saleMode === 'VOLUME'
            );

            const isCashPayment = onlinePaymentMethod.toLowerCase().includes('efectivo');
            const dispatchRuleText = hasMeasuredItems
              ? 'Pedido incluye productos por Peso/Medida: sujeto a confirmación exacta en balanza antes del pago final.'
              : isCashPayment
              ? 'Pago en Efectivo: Despacho sujeto a modalidad contra-entrega / verificación en efectivo.'
              : 'Pago Digital: El delivery sale inmediatamente tras confirmar el pago.';

            const newSale = {
              id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
              date: new Date().toISOString(),
              channel: 'ONLINE',
              status: 'PENDING',
              deliveryStep: 'RECEIVED',
              rating: null,
              ratingComment: '',
              customerCi: customer.ci,
              customerName: `${customer.firstName} ${customer.lastName}`,
              customerPhone: customer.phone,
              customerAddress: customer.address,
              paymentMethod: onlinePaymentMethod,
              couponCode: appliedCoupon ? appliedCoupon.code : null,
              couponDiscountUsd: cartSummary.couponDiscountUsd,
              cashbackUsedUsd: cartSummary.cashbackUsedUsd,
              earnedCashbackUsd: cartSummary.earnedCashbackUsd,
              items: enrichedCart.map((i) => ({
                productId: i.product.id,
                name: i.product.name,
                qty: i.qty,
                saleMode: i.saleMode,
                unitPrice: i.appliedPriceUsd,
                costPrice: i.product.costPrice,
                isWholesale: i.isWholesale,
              })),
              subtotalUsd: cartSummary.subtotalUsd,
              deliveryUsd: cartSummary.deliveryUsd,
              totalUsd: cartSummary.totalUsd,
              totalCostUsd,
              exchangeRate: settings.exchangeRate,
              totalBs: cartSummary.totalBs,
            };

            const updatedProducts = products.map((p) => {
              const bought = enrichedCart.find((i) => i.productId === p.id);
              if (!bought) return p;
              return { ...p, stock: Math.max(0, round3(p.stock - bought.qty)) };
            });

            const nextCashbackBalance = Math.max(
              0,
              round3(Number(customer.cashbackUsd || 0) - cartSummary.cashbackUsedUsd + cartSummary.earnedCashbackUsd)
            );
            const updatedCustomers = customers.map((c) =>
              c.ci === customer.ci ? { ...c, cashbackUsd: nextCashbackBalance } : c
            );

            const updatedSales = [newSale, ...sales];

            updateCloud({
              products: updatedProducts,
              sales: updatedSales,
              customers: updatedCustomers,
            });

            const itemsText = enrichedCart
              .map(
                (i) =>
                  `• ${formatMeasureQty(i.qty, i.saleMode)} de ${i.product.name} (${
                    i.isWholesale ? 'Mayor' : 'Detal'
                  }) = ${formatUsd(i.lineTotalUsd)}`
              )
              .join('\n');

            const waMessage =
              `🛒 *NUEVA ORDEN DIGITAL - ${settings.storeName.toUpperCase()}*\n` +
              `📋 *Orden N°:* ${newSale.id}\n\n` +
              `👤 *DATOS DEL CLIENTE:*\n` +
              `• *Nombre:* ${customer.firstName} ${customer.lastName}\n` +
              `• *Cédula (CI):* ${customer.ci}\n` +
              `• *Teléfono:* ${customer.phone}\n` +
              `• *Ubicación:* ${customer.address}\n\n` +
              `🛍️ *DETALLE SOLICITADO:*\n${itemsText}\n\n` +
              `💳 *Método de Pago:* ${onlinePaymentMethod}\n` +
              (cartSummary.couponDiscountUsd > 0
                ? `🎟️ *Cupón (${appliedCoupon.code}):* -${formatUsd(cartSummary.couponDiscountUsd)}\n`
                : '') +
              (cartSummary.cashbackUsedUsd > 0
                ? `🎁 *Puntos Cashback Canjeados:* -${formatUsd(cartSummary.cashbackUsedUsd)}\n`
                : '') +
              `🚚 *Delivery:* ${
                cartSummary.deliveryUsd === 0 ? 'GRATIS 🎉' : formatUsd(cartSummary.deliveryUsd)
              }\n` +
              `📦 *Nota:* ${dispatchRuleText}\n\n` +
              `💵 *TOTAL ESTIMADO USD:* ${formatUsd(cartSummary.totalUsd)}\n` +
              `🇻🇪 *TOTAL ESTIMADO BS:* ${formatBs(cartSummary.totalBs)} _(Tasa: Bs. ${Number(
                settings.exchangeRate
              ).toFixed(2)})_\n\n` +
              `¡Hola! Envío mi orden para verificar disponibilidad/peso y coordinar el pago.`;

            const cleanPhone = settings.whatsappNumber.replace(/\D/g, '');
            const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(waMessage)}`;

            setCart([]);
            setAppliedCoupon(null);
            setCouponInput('');
            setUseCashbackPoints(false);
            setIsCartOpen(false);
            setWhatsappConfirmModal({ sale: newSale, message: waMessage, url: waUrl });
            showToast(`¡Orden ${newSale.id} registrada! Puedes gestionarla en el Panel Admin.`);
          };

          const handleAdminButtonClick = () => {
            if (appMode === 'ADMIN') {
              setAppMode('STORE');
              return;
            }
            if (isAdminUnlocked) {
              setAppMode('ADMIN');
            } else {
              setPinInput('');
              setShowPinText(false);
              setPinError('');
              setShowPinModal(true);
            }
          };

          const handleVerifyPin = (e) => {
            e.preventDefault();
            const targetUser = staffUsers.find((u) => u.id === selectedStaffIdForLogin && u.active !== false);
            if (!targetUser) {
              setPinError('Selecciona un usuario activo válido.');
              return;
            }
            if (pinInput === targetUser.pin) {
              setActiveStaffUser(targetUser);
              setShowPinModal(false);
              setAppMode('ADMIN');
              const roleInfo = ROLE_DEFINITIONS[targetUser.role] || ROLE_DEFINITIONS.CASHIER;
              showToast(`Bienvenido ${targetUser.name} (${roleInfo.label})`);
            } else {
              setPinError('PIN o contraseña incorrecta para este cargo.');
            }
          };

          const handleRepeatPastOrder = (pastOrder) => {
            if (!pastOrder || !pastOrder.items) return;
            let addedCount = 0;
            const nextCart = [...cart];

            pastOrder.items.forEach((item) => {
              const prod = products.find((p) => p.id === item.productId);
              if (!prod || prod.stock <= 0) return;
              const qtyToAdd = Math.min(round3(item.qty), prod.stock);
              if (qtyToAdd <= 0) return;
              const idx = nextCart.findIndex((c) => c.productId === prod.id);
              if (idx >= 0) {
                nextCart[idx] = { ...nextCart[idx], qty: Math.min(prod.stock, round3(nextCart[idx].qty + qtyToAdd)) };
              } else {
                nextCart.push({ productId: prod.id, qty: qtyToAdd });
              }
              addedCount++;
            });

            if (addedCount === 0) {
              showToast('Los productos de ese pedido no tienen stock disponible ahora.', 'warning');
              return;
            }
            setCart(nextCart);
            setIsProfileModalOpen(false);
            setIsCartOpen(true);
            showToast(`🔄 ¡${addedCount} productos agregados al carrito desde tu pedido ${pastOrder.id}!`);
          };

          const handleRateOrder = (orderId, stars, comment = '') => {
            const updatedSales = sales.map((s) =>
              s.id === orderId ? { ...s, rating: stars, ratingComment: comment } : s
            );
            updateCloud({ sales: updatedSales });
            showToast(`⭐ ¡Gracias por calificar con ${stars} estrellas!`);
          };

          const storeDepartmentList = useMemo(() => {
            return [
              { id: 'all', name: 'Todos', emoji: '🏪' },
              { id: 'offers', name: 'Ofertas y Promociones', emoji: '🔥' },
              ...departments,
            ];
          }, [departments]);

          const filteredProducts = useMemo(() => {
            return products
              .filter((p) => {
                const matchesSearch =
                  p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                  p.department.toLowerCase().includes(searchQuery.toLowerCase()) ||
                  (p.description || '').toLowerCase().includes(searchQuery.toLowerCase());

                if (!matchesSearch) return false;

                if (selectedDepartment === 'Todos') return true;
                if (selectedDepartment === 'Ofertas y Promociones') return p.isOffer;
                return p.department === selectedDepartment;
              })
              .sort((a, b) => (b.isOffer ? 1 : 0) - (a.isOffer ? 1 : 0));
          }, [products, searchQuery, selectedDepartment]);

          const pendingOrdersCount = useMemo(
            () => sales.filter((s) => s.status === 'PENDING').length,
            [sales]
          );

          const lowStockCount = useMemo(
            () => products.filter((p) => p.stock <= 10).length,
            [products]
          );

          if (!isCloudLoaded) {
            return (
              <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                <div className="text-center space-y-3">
                  <div className="w-12 h-12 border-4 border-emerald-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                  <p className="font-extrabold text-slate-700">Conectando con tu Base de Datos en Firebase...</p>
                </div>
              </div>
            );
          }

          return (
            <div
              style={{ backgroundColor: brandPageBg }}
              className="min-h-screen text-slate-800 font-sans flex flex-col transition-colors duration-200"
            >
              {toast && (
                <div className="fixed bottom-20 right-5 z-50 animate-bounce">
                  <div
                    style={toast.type === 'success' ? { backgroundColor: brandPrimary } : undefined}
                    className={`flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium ${
                      toast.type === 'error'
                        ? 'bg-red-600 text-white border-red-700'
                        : toast.type === 'warning'
                        ? 'bg-amber-500 text-white border-amber-600'
                        : toast.type === 'info'
                        ? 'bg-slate-800 text-white border-slate-700'
                        : 'text-white border-white/20'
                    }`}
                  >
                    <CheckCircle2 className="w-5 h-5 shrink-0" />
                    <span>{toast.message}</span>
                  </div>
                </div>
              )}

                            {settings.festiveTheme && settings.festiveTheme !== 'NONE' && (
                <div className="bg-gradient-to-r from-red-700 via-amber-500 to-emerald-700 text-white text-xs font-extrabold py-2 px-4 text-center shadow-md flex items-center justify-center gap-2">
                  <span>
                    {settings.festiveTheme === 'NAVIDAD' && '🎄🎅 ¡FELIZ NAVIDAD Y PRÓSPERO AÑO NUEVO! Aprovecha nuestras cestas y ofertas navideñas 🎁✨'}
                    {settings.festiveTheme === 'CARNAVAL' && '🎭🎉 ¡FELIZ CARNAVAL! Disfruta nuestros precios especiales de temporada 🎊🥳'}
                    {settings.festiveTheme === 'SEMANA_SANTA' && '🌴🐟 ¡TEMPORADA DE SEMANA SANTA! Todo fresco para tu hogar en familia ✨'}
                    {settings.festiveTheme === 'MADRES_PADRES' && '💐👔 ¡MES ESPECIAL DE MAMÁ Y PAPÁ! Sorpréndelos con lo mejor 💝'}
                    {settings.festiveTheme === 'HALLOWEEN' && '🎃👻 ¡ESPECIAL DE OCTUBRE / HALLOWEEN! Dulces y combos terroríficamente buenos 🍬'}
                    {settings.festiveTheme === 'ANIVERSARIO' && '🎂🎈 ¡ESTAMOS DE ANIVERSARIO! Gracias por preferirnos, descuentos en toda la tienda 🎉'}
                  </span>
                </div>
              )}

              {settings.topBannerActive && settings.topBannerText && (
                <div
                  style={{ backgroundColor: brandAccent }}
                  className="text-slate-950 text-xs font-extrabold py-1.5 px-4 text-center tracking-wide shadow-2xs"
                >
                  {settings.topBannerText}
                </div>
              )}

              <header className="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
                <div
                  style={{ backgroundColor: brandHeader }}
                  className="text-white text-xs py-1.5 px-4 transition-colors"
                >
                  <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-3 sm:gap-4">
                      <span className="inline-flex items-center gap-1.5 font-semibold bg-black/25 px-2.5 py-0.5 rounded-full border border-white/15">
                        <DollarSign className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                        Tasa del día:{' '}
                        <strong style={{ color: brandAccent }}>
                          Bs. {Number(settings.exchangeRate).toFixed(2)}
                        </strong>
                      </span>
                      <span className="hidden md:inline-flex items-center gap-1 text-white/90">
                        <Truck className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                        Delivery GRATIS desde {formatUsd(settings.freeDeliveryThreshold)}
                      </span>
                    </div>

                    <div className="flex items-center gap-2">
                      {appMode === 'STORE' && (
                        <button
                          onClick={() => setIsSupportModalOpen(true)}
                          className="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full font-semibold bg-white/15 hover:bg-white/25 text-white border border-white/20 transition cursor-pointer"
                        >
                          <Headphones className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                          <span>Atención al Cliente</span>
                        </button>
                      )}

                      <button
                        onClick={handleAdminButtonClick}
                        style={
                          appMode === 'ADMIN'
                            ? { backgroundColor: brandAccent, color: '#0f172a' }
                            : undefined
                        }
                        className={`inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full font-semibold transition cursor-pointer ${
                          appMode === 'ADMIN'
                            ? 'hover:opacity-90'
                            : 'bg-black/30 hover:bg-black/45 text-white border border-white/20'
                        }`}
                      >
                        {appMode === 'ADMIN' ? (
                          <>
                            <Store className="w-3.5 h-3.5" />
                            Volver a Tienda Online
                          </>
                        ) : (
                          <>
                            <Lock className="w-3.5 h-3.5" />
                            Panel Admin / POS
                            {(pendingOrdersCount > 0 || lowStockCount > 0) && (
                              <span className="ml-1 bg-amber-400 text-slate-950 font-black text-[10px] px-1.5 rounded-full">
                                {pendingOrdersCount > 0 ? `${pendingOrdersCount} ped` : lowStockCount}
                              </span>
                            )}
                          </>
                        )}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
                  <div
                    onClick={() => setAppMode('STORE')}
                    className="flex items-center gap-2.5 cursor-pointer shrink-0"
                  >
                    {settings.storeLogo ? (
                      <img

                        alt={settings.storeName}

                      />
                    ) : (
                      <div
                        style={{ backgroundColor: brandPrimary }}
                        className="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-md"
                      >
                        <ShoppingBag className="w-6 h-6" />
                      </div>
                    )}
                    <div>
                      <h1 className="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 leading-none">
                        {settings.storeName}
                      </h1>
                      <p
                        style={{ color: brandPrimary }}
                        className="text-[11px] font-semibold mt-0.5"
                      >
                        {appMode === 'ADMIN'
                          ? 'SISTEMA POS, BALANZA Y FACTURACIÓN'

                      </p>
                    </div>
                  </div>

                  {appMode === 'STORE' && (
                    <div className="flex-1 max-w-xl hidden md:block">
                      <div className="relative">
                        <Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Buscar productos, carnes, quesos, líquidos..."
                          className="w-full pl-10 pr-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:bg-white transition"
                          style={{ '--tw-ring-color': brandPrimary }}
                        />
                        {searchQuery && (
                          <button
                            onClick={() => setSearchQuery('')}
                            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                          >
                            <X className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {appMode === 'STORE' && (
                    <div className="flex items-center gap-2 sm:gap-3">
                      <button
                        onClick={() => {
                          setCheckoutAfterAuth(false);
                          setIsProfileModalOpen(true);
                        }}
                        style={
                          currentUser
                            ? { borderColor: `${brandPrimary}60`, backgroundColor: `${brandPrimary}08` }
                            : undefined
                        }
                        className="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 transition cursor-pointer"
                      >
                        {currentUser?.photo ? (

              const formattedCi = /^[VEJ]-/.test(cleanCi) ? cleanCi : `V-${cleanCi.replace(/\D/g, '')}`;

                ci: formattedCi,
                firstName: guestData.firstName.trim(),
                lastName: guestData.lastName.trim(),
                phone: guestData.phone.trim(),
                address: guestData.address.trim(),

                    </div>

                          type="text"
                          required
                          placeholder="Nombre *"

                        <input
                          type="text"
                          required

                          onChange={(e) => setGuestData({ ...guestData, lastName: e.target.value })}
                          className="px-3 py-2 border border-slate-300 rounded-xl bg-white"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2.5">
                        <input
                          type="text"
                          required
                          placeholder="Cédula (Ej: V-12345678) *"
                          value={guestData.ci}
                          onChange={(e) => setGuestData({ ...guestData, ci: e.target.value })}

                        <input

                      <option value="Estado de mi Pedido / Delivery">
                        Estado de mi Pedido / Delivery
                      </option>
                      <option value="Solicitud de Producto o Compra al Mayor">

                      </option>
                      <option value="Soporte / Reclamo">Soporte / Reclamo</option>

                    <label className="block font-bold text-slate-700 mb-1">

                      className="w-full px-3.5 py-2 border border-slate-300 rounded-xl"
                    />
                  </div>

                  <button
                    type="submit"
                    style={{ backgroundColor: brandPrimary }}
                    className="w-full py-3.5 rounded-2xl text-white font-extrabold text-sm shadow-md hover:opacity-95 flex items-center justify-center gap-2 cursor-pointer"
                  >
                    <MessageCircle className="w-5 h-5" />
                    Escribir al WhatsApp con mis Datos
                  </button>
                </form>
              </div>
            </div>

        }

        function CustomerProfileModal({
          onClose,
          currentUser,
          customers,
          saveCustomerToCloudAndSession,
          setCurrentUserCi,
          sales,
          onRepeatOrder,
          onRateOrder,
          checkoutAfterAuth,
          onAuthSuccessAndCheckout,
          showToast,
          brandPrimary = '#059669',
        }) {
          const [authTab, setAuthTab] = useState('REGISTER');
          const [loginCi, setLoginCi] = useState('');
          const [isSearchingCloud, setIsSearchingCloud] = useState(false);
          const [formData, setFormData] = useState({
            firstName: currentUser?.firstName || '',
            lastName: currentUser?.lastName || '',
            ci: currentUser?.ci || '',
            phone: currentUser?.phone || '',
            address: currentUser?.address || '',
            photo: currentUser?.photo || null,
          });
          const [errorMsg, setErrorMsg] = useState('');
          const fileInputRef = useRef(null);

          const handlePhotoUpload = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
              setErrorMsg('Por favor selecciona una imagen válida (JPG o PNG).');
              return;
            }
            try {
              const compressed = await compressImageFile(file, 260, 0.78);
              setFormData((prev) => ({ ...prev, photo: compressed }));
              showToast('Foto cargada correctamente');
            } catch (err) {
              setErrorMsg('No se pudo procesar la foto.');
            }
          };

          const handleRegisterOrUpdate = (e) => {
            e.preventDefault();
            setErrorMsg('');

            const cleanCi = formData.ci.trim().toUpperCase();
            if (
              !formData.firstName.trim() ||
              !formData.lastName.trim() ||
              !cleanCi ||
              !formData.phone.trim() ||
              !formData.address.trim()
            ) {
              setErrorMsg('Todos los campos son obligatorios para coordinar tu entrega.');
              return;
            }

            const formattedCi = /^[VEJ]-/.test(cleanCi) ? cleanCi : `V-${cleanCi.replace(/\D/g, '')}`;

            const customerRecord = {
              ci: formattedCi,
              firstName: formData.firstName.trim(),
              lastName: formData.lastName.trim(),
              phone: formData.phone.trim(),
              address: formData.address.trim(),
              photo: formData.photo,
              createdAt: currentUser?.createdAt || new Date().toISOString(),
            };

            saveCustomerToCloudAndSession(customerRecord);
            showToast(
              currentUser
                ? 'Perfil actualizado y guardado en la nube'
                : `¡Bienvenido ${customerRecord.firstName}! Tu cuenta quedó guardada.`
            );

            if (checkoutAfterAuth) {
              onAuthSuccessAndCheckout(customerRecord);
            } else if (!currentUser) {
              onClose();
            }
          };

          const handleLoginByCi = async (e) => {
            e.preventDefault();
            setErrorMsg('');
            const clean = loginCi.trim().toUpperCase();
            if (!clean) {
              setErrorMsg('Por favor escribe tu número de Cédula.');
              return;
            }
            const formatted = /^[VEJ]-/.test(clean) ? clean : `V-${clean.replace(/\D/g, '')}`;

            let found = customers.find((c) => c.ci === formatted);

            if (!found && db) {
              setIsSearchingCloud(true);
              try {
                const snap = await getDoc(doc(db, 'clientes', formatted));
                if (snap.exists()) {
                  found = snap.data();
                  saveCustomerToCloudAndSession(found);
                }
              } catch (err) {
                console.error('Error buscando cédula en Firebase:', err);
              } finally {
                setIsSearchingCloud(false);
              }
            }

            if (!found) {
              setErrorMsg(
                'No encontramos esa Cédula registrada. Toca "Soy Nuevo (Registrarme)" para registrarte una sola vez.'
              );
              return;
            }

            setCurrentUserCi(found.ci);
            showToast(`¡Hola de nuevo, ${found.firstName}! Sesión guardada.`);
            if (checkoutAfterAuth) {
              onAuthSuccessAndCheckout(found);
            } else {
              onClose();
            }
          };

          const userSales = useMemo(() => {
            if (!currentUser) return [];
            return sales.filter((s) => s.customerCi === currentUser.ci);
          }, [sales, currentUser]);

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-xl w-full shadow-2xl overflow-hidden my-8">
                <div
                  style={{ backgroundColor: brandPrimary }}
                  className="px-6 py-4 text-white flex items-center justify-between"
                >
                  <div>
                    <h3 className="font-extrabold text-lg">
                      {currentUser ? 'Mi Perfil de Cliente' : 'Registro e Ingreso Rápido'}
                    </h3>
                    <p className="text-xs text-white/85">
                      {checkoutAfterAuth
                        ? 'Completa tus datos una sola vez para enviar tu pedido'
                        : 'Tus datos quedan guardados permanentemente en este dispositivo y en la nube'}
                    </p>
                  </div>
                  <button
                    onClick={onClose}
                    className="p-2 rounded-xl bg-black/20 hover:bg-black/30 text-white cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 max-h-[80vh] overflow-y-auto space-y-6">
                  {!currentUser && (
                    <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                      <button
                        type="button"
                        onClick={() => {
                          setAuthTab('REGISTER');
                          setErrorMsg('');
                        }}
                        className={`py-2 rounded-lg text-xs font-extrabold transition cursor-pointer ${
                          authTab === 'REGISTER'
                            ? 'bg-white text-emerald-700 shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Soy Nuevo (Registrarme)
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setAuthTab('LOGIN');
                          setErrorMsg('');
                        }}
                        className={`py-2 rounded-lg text-xs font-extrabold transition cursor-pointer ${
                          authTab === 'LOGIN'
                            ? 'bg-white text-emerald-700 shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        Ya tengo cuenta (Ingresar)
                      </button>
                    </div>
                  )}

                  {errorMsg && (
                    <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold">
                      {errorMsg}
                    </div>
                  )}

                  {!currentUser && authTab === 'LOGIN' ? (
                    <form onSubmit={handleLoginByCi} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Ingresa tu Cédula de Identidad (CI)
                        </label>
                        <input
                          type="text"
                          value={loginCi}
                          onChange={(e) => setLoginCi(e.target.value)}
                          placeholder="Ej: V-18456789"
                          className="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                        <p className="text-[11px] text-slate-400 mt-1">
                          Al ingresar una vez, tu cuenta quedará abierta automáticamente en este navegador.
                        </p>
                      </div>
                      <button
                        type="submit"
                        disabled={isSearchingCloud}
                        style={{ backgroundColor: brandPrimary }}
                        className="w-full py-3 hover:opacity-95 text-white font-extrabold rounded-xl text-sm shadow-md transition cursor-pointer"
                      >
                        {isSearchingCloud ? 'Buscando en la nube...' : 'Ingresar a mi Cuenta'}
                      </button>
                    </form>
                  ) : (
                    <form onSubmit={handleRegisterOrUpdate} className="space-y-4">
                      <div className="flex items-center gap-4 p-3 bg-slate-50 rounded-2xl border border-slate-200">
                        <div className="relative">
                          {formData.photo ? (
                            <img
                              src={formData.photo}
                              alt="Foto perfil"
                              className="w-16 h-16 rounded-full object-cover border-2 border-emerald-500"
                            />
                          ) : (
                            <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl font-black">
                              {formData.firstName ? formData.firstName[0].toUpperCase() : <User className="w-7 h-7" />}
                            </div>
                          )}
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow hover:bg-emerald-700 cursor-pointer"
                            title="Subir foto JPG"
                          >
                            <Camera className="w-3.5 h-3.5" />
                          </button>
                        </div>
                        <div className="flex-1">
                          <p className="text-xs font-bold text-slate-800">Foto de Perfil (JPG / PNG)</p>
                          <p className="text-[11px] text-slate-500">
                            Opcional. Personaliza tu perfil de cliente en el abasto.
                          </p>
                          <input
                            ref={fileInputRef}
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            onChange={handlePhotoUpload}
                            className="hidden"
                          />
                          <button
                            type="button"
                            onClick={() => fileInputRef.current?.click()}
                            className="mt-1.5 text-xs font-bold text-emerald-700 hover:underline cursor-pointer"
                          >
                            Seleccionar archivo de imagen...
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Nombre *</label>
                          <input
                            type="text"
                            required
                            value={formData.firstName}
                            onChange={(e) => setFormData({ ...formData, firstName: e.target.value })}
                            placeholder="Ej: José"
                            className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Apellido *</label>
                          <input
                            type="text"
                            required
                            value={formData.lastName}
                            onChange={(e) => setFormData({ ...formData, lastName: e.target.value })}
                            placeholder="Ej: Pérez"
                            className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">
                            Cédula de Identidad (CI) *
                          </label>
                          <input
                            type="text"
                            required
                            disabled={Boolean(currentUser)}
                            value={formData.ci}
                            onChange={(e) => setFormData({ ...formData, ci: e.target.value })}
                            placeholder="Ej: V-12345678"
                            className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm font-semibold disabled:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">
                            Teléfono / WhatsApp *
                          </label>
                          <input
                            type="tel"
                            required
                            value={formData.phone}
                            onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                            placeholder="Ej: 0412-1234567"
                            className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          Ubicación / Dirección Exacta de Entrega *
                        </label>
                        <textarea
                          rows={2}
                          required
                          value={formData.address}
                          onChange={(e) => setFormData({ ...formData, address: e.target.value })}
                          placeholder="Sector, calle, número de casa/edificio y punto de referencia..."
                          className="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                      </div>

                      <div className="flex items-center gap-2 pt-1">
                        <button
                          type="submit"
                          style={{ backgroundColor: brandPrimary }}
                          className="flex-1 py-3 hover:opacity-95 text-white font-extrabold rounded-xl text-sm shadow-md transition cursor-pointer"
                        >
                          {checkoutAfterAuth
                            ? 'Guardar y Continuar a WhatsApp'
                            : currentUser
                            ? 'Guardar Cambios del Perfil'
                            : 'Completar Registro'}
                        </button>
                        {currentUser && (
                          <button
                            type="button"

                              setCurrentUserCi(null);
                              onClose();
                              showToast('Sesión cerrada', 'info');
                            }}
                            className="px-4 py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs flex items-center gap-1.5 cursor-pointer"
                          >
                            <LogOut className="w-4 h-4" />
                            Salir
                          </button>
                        )}
                      </div>
                    </form>

                  {currentUser && (

                          <span className="font-extrabold text-amber-900 block">
                            🎁 Billetera Cashback / Puntos Acumulados
                          </span>
                          <span className="text-[11px] text-amber-700">
                            Ganas 2% automático en cada compra para descontar en tu próximo pedido
                          </span>
                        </div>
                        <strong className="text-lg font-black text-emerald-700">
                          {formatUsd(Number(currentUser.cashbackUsd || 0))}
                        </strong>
                      </div>

                      <div className="flex items-center justify-between">
                        <h4 className="font-extrabold text-slate-800 text-sm flex items-center gap-1.5">
                          <Receipt className="w-4 h-4 text-emerald-600" />
                          Mi Historial y Seguimiento ({userSales.length})
                        </h4>
                        <span className="text-xs font-bold text-emerald-700">
                          Completado:{' '}
                          {formatUsd(
                            userSales
                              .filter((s) => (s.status || 'COMPLETED') === 'COMPLETED')
                              .reduce((acc, s) => acc + s.totalUsd, 0)
                          )}
                        </span>
                      </div>

                      {userSales.length === 0 ? (
                        <p className="text-xs text-slate-400 bg-slate-50 p-4 rounded-xl text-center">
                          Aún no tienes compras registradas con tu cédula {currentUser.ci}.
                        </p>
                      ) : (
                        <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                          {userSales.map((sale) => {
                            const status = sale.status || 'COMPLETED';
                            const stepList = ['RECEIVED', 'PREPARING', 'ON_THE_WAY', 'DELIVERED'];
                            const stepLabels = ['Recibido', 'Preparando', 'En Camino', 'Entregado'];
                            const currentStep =
                              sale.deliveryStep || (status === 'COMPLETED' ? 'DELIVERED' : 'RECEIVED');
                            const currentStepIdx = stepList.indexOf(currentStep);

                            return (
                              <div
                                key={sale.id}
                                className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70 space-y-2.5 text-xs"
                              >
                                <div className="flex items-center justify-between">
                                  <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                      <span className="font-extrabold text-slate-800">{sale.id}</span>
                                      <span
                                        className={`px-2 py-0.5 rounded-full font-extrabold text-[10px] ${
                                          status === 'PENDING'
                                            ? 'bg-amber-100 text-amber-800'
                                            : status === 'CANCELLED'
                                            ? 'bg-red-100 text-red-700'
                                            : 'bg-emerald-100 text-emerald-800'
                                        }`}
                                      >
                                        {status === 'PENDING'
                                          ? '⏳ En Proceso'
                                          : status === 'CANCELLED'
                                          ? '✕ Anulada'
                                          : '✓ Finalizada'}
                                      </span>
                                    </div>
                                    <p className="text-slate-500 mt-0.5">
                                      {new Date(sale.date).toLocaleDateString('es-VE', {
                                        day: '2-digit',
                                        month: 'short',
                                        year: 'numeric',
                                        hour: '2-digit',
                                        minute: '2-digit',
                                      })}{' '}
                                      • {sale.items.length} prod.
                                    </p>
                                  </div>
                                  <div className="text-right">
                                    <span className="font-extrabold text-emerald-700 text-sm block">
                                      {formatUsd(sale.totalUsd)}
                                    </span>
                                    <span className="text-slate-500">{formatBs(sale.totalBs)}</span>
                                  </div>
                                </div>

                                {sale.channel === 'ONLINE' && status !== 'CANCELLED' && (
                                  <div className="grid grid-cols-4 gap-1 text-[10px] font-bold text-center">
                                    {stepList.map((sKey, idx) => (
                                      <div
                                        key={sKey}
                                        className={`py-1 rounded-lg ${
                                          idx <= currentStepIdx
                                            ? 'bg-emerald-600 text-white'
                                            : 'bg-slate-200 text-slate-500'
                                        }`}
                                      >
                                        {stepLabels[idx]}
                                      </div>
                                    ))}
                                  </div>
                                )}

                                <div className="flex items-center justify-between pt-1 border-t border-slate-200/70">
                                  <button
                                    type="button"
                                    onClick={() => onRepeatOrder && onRepeatOrder(sale)}
                                    className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-[11px] flex items-center gap-1 cursor-pointer"
                                  >
                                    <RotateCcw className="w-3 h-3 text-amber-400" />

                                  {(status === 'COMPLETED' || currentStep === 'DELIVERED') && (
                                    <div className="flex items-center gap-1">

                                          key={star}

                                          onClick={() => onRateOrder && onRateOrder(sale.id, star)}

                                          }`}
                                          title={`${star} estrellas`}

                                      ))}

                                  )}

                              </div>
                            );
