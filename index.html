                      <h3 className="font-extrabold text-slate-900 text-lg">
                        {editingProduct.isNew ? 'Agregar Nuevo Producto' : 'Editar Producto'}
                      </h3>
                      <button
                        onClick={() => setEditingProduct(null)}
                        className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 cursor-pointer"
                      >
                        ✕
                      </button>
                    </div>

                    <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                      <div className="flex items-center gap-4 p-3 rounded-2xl bg-slate-50 border border-slate-200">
                        <div className="w-16 h-16 rounded-2xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shrink-0">
                          {editingProduct.image ? (
                            <img
                              src={editingProduct.image}
                              alt="Vista previa"
                              className="w-full h-full object-cover"
                            />
                          ) : (
                            <span className="text-3xl">{editingProduct.emoji || '📦'}</span>
                          )}
                        </div>
                        <div className="flex-1 space-y-1">
                          <p className="font-bold text-slate-800">Fotografía del Producto (JPG/PNG)</p>
                          <p className="text-[11px] text-slate-500">
                            El cliente podrá tocar esta imagen para verla ampliada junto con su descripción.
                          </p>
                          <input
                            ref={productPhotoRef}
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            onChange={handleProductImageUpload}
                            className="hidden"
                          />
                          <div className="flex items-center gap-2 pt-1">
                            <button
                              type="button"
                              onClick={() => productPhotoRef.current?.click()}
                              className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold hover:bg-emerald-700 cursor-pointer inline-flex items-center gap-1"
                            >
                              <Camera className="w-3.5 h-3.5" />
                              Subir Foto JPG
                            </button>
                            {editingProduct.image && (
                              <button
                                type="button"
                                onClick={() =>
                                  setEditingProduct({ ...editingProduct, image: null })
                                }
                                className="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 font-bold hover:bg-red-100 cursor-pointer"
                              >
                                Quitar Foto
                              </button>
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-4 gap-3">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Emoji</label>
                          <input
                            type="text"
                            value={editingProduct.emoji}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, emoji: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-center text-xl"
                          />
                        </div>
                        <div className="col-span-3">
                          <label className="block font-bold text-slate-700 mb-1">
                            Nombre del Producto *
                          </label>
                          <input
                            type="text"
                            required
                            value={editingProduct.name}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, name: e.target.value })
                            }
                            placeholder="Ej: Queso Amarillo Gouda (Por Kg)"
                            className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm"
                          />
                        </div>
                      </div>

                      {/* Campo de Descripción del Producto */}
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">
                          Descripción del Producto (Visible para el Cliente)
                        </label>
                        <textarea
                          rows={2}
                          value={editingProduct.description || ''}
                          onChange={(e) =>
                            setEditingProduct({ ...editingProduct, description: e.target.value })
                          }
                          placeholder="Ej: Queso importado madurado, ideal para sándwiches y gratinar. Se pesa exacto en balanza..."
                          className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs"
                        />
                      </div>

                      {/* Selector de Modalidad de Venta: Unidad, Peso (Kg/g) o Litro (Lt/mL) */}
                      <div className="p-3 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2">
                        <label className="block font-extrabold text-slate-800">
                          ¿Cómo se vende este producto?
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                          {[
                            { id: 'UNIT', label: 'Por Unidad', sub: 'Paquete / Caja' },
                            { id: 'WEIGHT', label: 'Por Peso (Kg)', sub: 'Gramos / Kilos' },
                            { id: 'VOLUME', label: 'Por Litro (Lt)', sub: 'Mililitros / Litros' },
                          ].map((opt) => {
                            const selected = (editingProduct.saleMode || 'UNIT') === opt.id;
                            return (
                              <button
                                key={opt.id}
                                type="button"
                                onClick={() =>
                                  setEditingProduct({
                                    ...editingProduct,
                                    saleMode: opt.id,
                                    unit:
                                      opt.id === 'WEIGHT'
                                        ? 'Kilogramo (Kg)'
                                        : opt.id === 'VOLUME'
                                        ? 'Litro (Lt)'
                                        : 'Unidad',
                                  })
                                }
                                className={`p-2 rounded-xl border text-left transition cursor-pointer ${
                                  selected
                                    ? 'bg-slate-900 text-white border-slate-900 shadow-xs'
                                    : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                }`}
                              >
                                <span className="block font-extrabold text-xs">{opt.label}</span>
                                <span
                                  className={`block text-[10px] ${
                                    selected ? 'text-amber-300' : 'text-slate-400'
                                  }`}
                                >
                                  {opt.sub}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">Departamento</label>
                          <select
                            value={editingProduct.department}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, department: e.target.value })
                            }
                            className="w-full px-3 py-2.5 border border-slate-300 rounded-xl bg-white font-semibold"
                          >
                            {departments.map((d) => (
                              <option key={d.id} value={d.name}>
                                {d.emoji} {d.name}
                              </option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">
                            Etiqueta Presentación
                          </label>
                          <input
                            type="text"
                            value={editingProduct.unit}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, unit: e.target.value })
                            }
                            placeholder="Ej: Kilogramo (Kg) / Litro (Lt)"
                            className="w-full px-3 py-2.5 border border-slate-300 rounded-xl"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">
                            Costo {formatBasePriceLabel(editingProduct.saleMode || 'UNIT')} ($)
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            min="0"
                            required
                            value={editingProduct.costPrice}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, costPrice: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white font-bold"
                          />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">
                            Detal {formatBasePriceLabel(editingProduct.saleMode || 'UNIT')} ($)
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            min="0"
                            required
                            value={editingProduct.retailPrice}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, retailPrice: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white font-bold text-slate-900"
                          />
                        </div>
                        <div>
                          <label className="block font-bold text-emerald-700 mb-1">
                            Mayor {formatBasePriceLabel(editingProduct.saleMode || 'UNIT')} ($)
                          </label>
                          <input
                            type="number"
                            step="0.01"
                            min="0"
                            required
                            value={editingProduct.wholesalePrice}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, wholesalePrice: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-emerald-300 rounded-xl bg-white font-bold text-emerald-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-3 items-end">
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">
                            Mín. Mayor ({editingProduct.saleMode === 'WEIGHT' ? 'Kg' : editingProduct.saleMode === 'VOLUME' ? 'Lt' : 'und'})
                          </label>
                          <input
                            type="number"
                            step="0.1"
                            min="1"
                            required
                            value={editingProduct.wholesaleMinQty}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, wholesaleMinQty: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold"
                          />
                        </div>
                        <div>
                          <label className="block font-bold text-slate-700 mb-1">
                            Stock ({editingProduct.saleMode === 'WEIGHT' ? 'Kg' : editingProduct.saleMode === 'VOLUME' ? 'Lt' : 'und'})
                          </label>
                          <input
                            type="number"
                            step="0.001"
                            min="0"
                            required
                            value={editingProduct.stock}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, stock: e.target.value })
                            }
                            className="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold"
                          />
                        </div>
                        <label className="flex items-center gap-2 p-2.5 border border-slate-200 rounded-xl cursor-pointer bg-amber-50/60">
                          <input
                            type="checkbox"
                            checked={editingProduct.isOffer}
                            onChange={(e) =>
                              setEditingProduct({ ...editingProduct, isOffer: e.target.checked })
                            }
                            className="w-4 h-4 accent-amber-500"
                          />
                          <span className="font-bold text-amber-800">En Oferta</span>
                        </label>
                      </div>

                      <div className="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
                        {!editingProduct.isNew ? (
                          <button
                            type="button"
                            onClick={() => handleDeleteProduct(editingProduct)}
                            className="px-3.5 py-2.5 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-bold flex items-center gap-1.5 cursor-pointer"
                          >
                            <Trash2 className="w-4 h-4" />
                            Eliminar Producto
                          </button>
                        ) : (
                          <div />
                        )}

                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => setEditingProduct(null)}
                            className="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-600 cursor-pointer"
                          >
                            Cancelar
                          </button>
                          <button
                            type="submit"
                            className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-md cursor-pointer"
                          >
                            Guardar Producto
                          </button>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function CashControlTab({
          settings,
          cashMovements,
          setCashMovements,
          cashShifts = [],
          setCashShifts,
          activeStaffUser,
          showToast,
        }) {
          const [movType, setMovType] = useState('IN');
          const [category, setCategory] = useState('Ingreso Extra');
          const [description, setDescription] = useState('');
          const [amountInput, setAmountInput] = useState('');
          const [currencyInput, setCurrencyInput] = useState('USD');

          const [declUsd, setDeclUsd] = useState('');
          const [declBs, setDeclBs] = useState('');
          const [declDigitalBs, setDeclDigitalBs] = useState('');
          const [shiftNotes, setShiftNotes] = useState('');

          const totals = useMemo(() => {
            const totalIn = cashMovements
              .filter((m) => m.type === 'IN')
              .reduce((acc, m) => acc + m.amountUsd, 0);
            const totalOut = cashMovements
              .filter((m) => m.type === 'OUT')
              .reduce((acc, m) => acc + m.amountUsd, 0);
            return { totalIn, totalOut, netBalance: totalIn - totalOut };
          }, [cashMovements]);

          const handleAddMovement = (e) => {
            e.preventDefault();
            const rawVal = Number(amountInput);
            if (!rawVal || rawVal <= 0) return;

            const amountUsd =
              currencyInput === 'BS' ? rawVal / settings.exchangeRate : rawVal;

            const newMov = {
              id: `MOV-${Date.now()}`,
              date: new Date().toISOString(),
              type: movType,
              category,
              description: description.trim() || category,
              amountUsd,
              currencyUsed: currencyInput,
            };

            const updatedMovs = [newMov, ...cashMovements];
            setCashMovements(updatedMovs);
            setAmountInput('');
            setDescription('');
            showToast(
              movType === 'IN'
                ? 'Entrada de caja registrada y sincronizada'
                : 'Salida / gasto de caja registrado'
            );
          };

          const totalCierreUsd = round3(
            (Number(declUsd) || 0) +
              (Number(declBs) || 0) / settings.exchangeRate +
              (Number(declDigitalBs) || 0) / settings.exchangeRate
          );

          const handleSaveSimpleDailyClosing = (e) => {
            e.preventDefault();
            if (!setCashShifts) return;
            const usdVal = Number(declUsd) || 0;
            const bsVal = Number(declBs) || 0;
            const digBsVal = Number(declDigitalBs) || 0;
            if (usdVal <= 0 && bsVal <= 0 && digBsVal <= 0) {
              showToast('Coloca al menos un monto recibido en el día', 'warning');
              return;
            }

            const newClosing = {
              id: `CIERRE-${new Date().toLocaleDateString('es-VE').replace(/\//g, '')}-${Math.floor(10 + Math.random() * 89)}`,
              status: 'CLOSED',
              closedAt: new Date().toISOString(),
              closedBy: activeStaffUser?.name || 'Principal',
              declaredUsd: usdVal,
              declaredBs: bsVal,
              declaredDigitalBs: digBsVal,
              totalEquivalentUsd: totalCierreUsd,
              notes: shiftNotes.trim(),
            };

            setCashShifts([newClosing, ...(cashShifts || [])]);
            setDeclUsd('');
            setDeclBs('');
            setDeclDigitalBs('');
            setShiftNotes('');
            showToast(`✅ Cierre del día guardado (${formatUsd(totalCierreUsd)} total)`);
          };

          return (
            <div className="space-y-6">
              {/* CIERRE DE CAJA SIMPLE AL FINALIZAR EL DÍA */}
              <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-md space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span className="text-[11px] uppercase font-extrabold text-amber-400">
                      📋 Cierre Rápido de Caja
                    </span>
                    <h3 className="text-base font-extrabold">Colocar Montos al Finalizar el Día</h3>
                    <p className="text-xs text-slate-300">
                      Escribe lo que quedó en caja al cerrar el día y guárdalo con un toque.
                    </p>
                  </div>
                  <div className="text-right bg-white/10 px-4 py-2 rounded-2xl">
                    <span className="text-[11px] text-slate-300 block">Total Equivalente ($)</span>
                    <strong className="text-2xl font-black text-emerald-400">
                      {formatUsd(totalCierreUsd)}
                    </strong>
                  </div>
                </div>

                <form onSubmit={handleSaveSimpleDailyClosing} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs text-slate-900">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Efectivo Dólares ($)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        value={declUsd}
                        onChange={(e) => setDeclUsd(e.target.value)}
                        placeholder="0.00"
                        className="w-full px-3 py-2.5 rounded-xl font-bold bg-white"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Efectivo Bolívares (Bs.)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        value={declBs}
                        onChange={(e) => setDeclBs(e.target.value)}
                        placeholder="0.00"
                        className="w-full px-3 py-2.5 rounded-xl font-bold bg-white"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Punto / Pago Móvil (Bs.)</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0"
                        value={declDigitalBs}
                        onChange={(e) => setDeclDigitalBs(e.target.value)}
                        placeholder="0.00"
                        className="w-full px-3 py-2.5 rounded-xl font-bold bg-white"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">Nota (Opcional)</label>
                      <input
                        type="text"
                        value={shiftNotes}
                        onChange={(e) => setShiftNotes(e.target.value)}
                        placeholder="Ej: Cierre martes..."
                        className="w-full px-3 py-2.5 rounded-xl bg-white"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end">
                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs shadow-md cursor-pointer"
                    >
                      💾 Guardar Cierre del Día
                    </button>
                  </div>
                </form>

                {cashShifts && cashShifts.filter((s) => s.status === 'CLOSED').length > 0 && (
                  <div className="pt-3 border-t border-white/10 space-y-2 text-xs">
                    <span className="text-[11px] font-bold text-slate-400 uppercase">Historial de Cierres Diarios:</span>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      {cashShifts
                        .filter((s) => s.status === 'CLOSED')
                        .slice(0, 6)
                        .map((sh) => {
                          const totalEq =
                            sh.totalEquivalentUsd !== undefined
                              ? sh.totalEquivalentUsd
                              : round3(
                                  (sh.declaredUsd || 0) +
                                    (sh.declaredBs || 0) / settings.exchangeRate +
                                    (sh.declaredDigitalUsd || 0)
                                );
                          return (
                            <div key={sh.id} className="p-3 rounded-xl bg-white/5 flex items-center justify-between gap-2">
                              <div>
                                <strong className="text-white">{new Date(sh.closedAt).toLocaleDateString('es-VE')}</strong>{' '}
                                <span className="text-slate-400">({sh.closedBy})</span>
                                <span className="block text-[11px] text-slate-300 mt-0.5">
                                  Efec: {formatUsd(sh.declaredUsd)} • Efec Bs: {formatBs(sh.declaredBs)}
                                  {sh.declaredDigitalBs > 0 ? ` • Punto/PM: ${formatBs(sh.declaredDigitalBs)}` : ''}
                                </span>
                                {sh.notes && <span className="block text-[10px] text-amber-300">{sh.notes}</span>}
                              </div>
                              <span className="font-black text-emerald-400 text-sm shrink-0">
                                {formatUsd(totalEq)}
                              </span>
                            </div>
                          );
                        })}
                    </div>
                  </div>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
                  <span className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                    <ArrowUpRight className="w-4 h-4 text-emerald-600" />
                    TOTAL ENTRADAS DE CAJA
                  </span>
                  <p className="text-2xl font-black text-emerald-600 mt-1">
                    {formatUsd(totals.totalIn)}
                  </p>
                  <p className="text-xs text-slate-400">
                    {formatBs(totals.totalIn * settings.exchangeRate)}
                  </p>
                </div>

                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">
                  <span className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                    <ArrowDownRight className="w-4 h-4 text-red-600" />
                    TOTAL SALIDAS / GASTOS
                  </span>
                  <p className="text-2xl font-black text-red-600 mt-1">
                    {formatUsd(totals.totalOut)}
                  </p>
                  <p className="text-xs text-slate-400">
                    {formatBs(totals.totalOut * settings.exchangeRate)}
                  </p>
                </div>

                <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-md">
                  <span className="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                    <Wallet className="w-4 h-4 text-amber-400" />
                    SALDO NETO ACTUAL EN CAJA
                  </span>
                  <p className="text-2xl font-black text-amber-400 mt-1">
                    {formatUsd(totals.netBalance)}
                  </p>
                  <p className="text-xs text-slate-300">
                    {formatBs(totals.netBalance * settings.exchangeRate)}
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <form
                  onSubmit={handleAddMovement}
                  className="lg:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 shadow-xs space-y-4 h-fit"
                >
                  <h3 className="font-extrabold text-slate-900">Registrar Movimiento de Caja</h3>

                  <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                    <button
                      type="button"
                      onClick={() => {
                        setMovType('IN');
                        setCategory('Ingreso Extra');
                      }}
                      className={`py-2 rounded-lg text-xs font-extrabold cursor-pointer ${
                        movType === 'IN'
                          ? 'bg-emerald-600 text-white shadow-xs'
                          : 'text-slate-600'
                      }`}
                    >
                      + Entrada ($)
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setMovType('OUT');
                        setCategory('Pago a Proveedores');
                      }}
                      className={`py-2 rounded-lg text-xs font-extrabold cursor-pointer ${
                        movType === 'OUT'
                          ? 'bg-red-600 text-white shadow-xs'
                          : 'text-slate-600'
                      }`}
                    >
                      - Salida / Gasto
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Concepto</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold bg-white"
                    >
                      {movType === 'IN' ? (
                        <>
                          <option value="Ingreso Extra">Ingreso Extra / Base de Caja</option>
                          <option value="Cobro Cuenta por Cobrar">Cobro Cuenta por Cobrar</option>
                          <option value="Otro Ingreso">Otro Ingreso</option>
                        </>
                      ) : (
                        <>
                          <option value="Pago a Proveedores">Pago a Proveedores</option>
                          <option value="Gastos Operativos / Servicios">Gastos Operativos / Servicios</option>
                          <option value="Pago Delivery / Transporte">Pago Delivery / Transporte</option>
                          <option value="Retiro del Dueño">Retiro del Dueño</option>
                        </>
                      )}
                    </select>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="block text-xs font-bold text-slate-700 mb-1">Monto</label>
                      <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        required
                        value={amountInput}
                        onChange={(e) => setAmountInput(e.target.value)}
                        placeholder="0.00"
                        className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Moneda</label>
                      <select
                        value={currencyInput}
                        onChange={(e) => setCurrencyInput(e.target.value)}
                        className="w-full px-2 py-2.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                      >
                        <option value="USD">USD ($)</option>
                        <option value="BS">Bs.</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Descripción / Nota
                    </label>
                    <input
                      type="text"
                      value={description}
                      onChange={(e) => setDescription(e.target.value)}
                      placeholder="Ej: Pago factura distribuidora..."
                      className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs"
                    />
                  </div>

                  <button
                    type="submit"
                    className={`w-full py-3 rounded-xl text-white font-extrabold text-xs shadow-md cursor-pointer ${
                      movType === 'IN'
                        ? 'bg-emerald-600 hover:bg-emerald-700'
                        : 'bg-red-600 hover:bg-red-700'
                    }`}
                  >
                    Registrar {movType === 'IN' ? 'Entrada' : 'Salida'}
                  </button>
                </form>

                <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 shadow-xs space-y-3">
                  <h3 className="font-extrabold text-slate-900">Historial de Movimientos de Caja</h3>
                  <div className="space-y-2 max-h-[450px] overflow-y-auto pr-1">

        function ProductRotationTab({ settings, sales, products }) {
          const [rotPeriod, setRotPeriod] = useState('ALL');
          const [customStart, setCustomStart] = useState('');
          const [customEnd, setCustomEnd] = useState('');

          const rotationList = useMemo(() => {
            const now = new Date();
            const map = {};

            products.forEach((p) => {
              map[p.id] = {
                id: p.id,
                name: p.name,
                department: p.department,
                saleMode: getProductSaleMode(p),
                stock: p.stock,
                qtySold: 0,
                revenueUsd: 0,
                profitUsd: 0,
                ordersCount: 0,
              };
            });

            sales.forEach((s) => {
              if ((s.status || 'COMPLETED') !== 'COMPLETED') return;
              const d = new Date(s.date);
              const diffDays = (now - d) / (1000 * 60 * 60 * 24);

              if (rotPeriod === 'TODAY' && d.toDateString() !== now.toDateString()) return;
              if (rotPeriod === 'WEEK' && diffDays > 7) return;
              if (rotPeriod === 'MONTH' && diffDays > 30) return;
              if (rotPeriod === 'YEAR' && diffDays > 365) return;
              if (rotPeriod === 'CUSTOM') {
                const dateStr = d.toISOString().slice(0, 10);
                if (customStart && dateStr < customStart) return;
                if (customEnd && dateStr > customEnd) return;
              }

              (s.items || []).forEach((item) => {
                if (!map[item.productId]) {
                  map[item.productId] = {
                    id: item.productId,
                    name: item.name,
                    department: 'General',
                    saleMode: item.saleMode || 'UNIT',
                    stock: 0,
                    qtySold: 0,
                    revenueUsd: 0,
                    profitUsd: 0,
                    ordersCount: 0,
                  };
                }
                map[item.productId].qtySold = round3(map[item.productId].qtySold + item.qty);
                map[item.productId].revenueUsd = round3(map[item.productId].revenueUsd + item.qty * item.unitPrice);
                map[item.productId].profitUsd = round3(
                  map[item.productId].profitUsd + item.qty * (item.unitPrice - (item.costPrice || 0))
                );
                map[item.productId].ordersCount += 1;
              });
            });

            return Object.values(map).sort((a, b) => b.qtySold - a.qtySold);
          }, [sales, products, rotPeriod, customStart, customEnd]);

          const maxSold = Math.max(1, ...rotationList.map((r) => r.qtySold));

          return (
            <div className="space-y-6">
              <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900">
                      Productos con Mayor Rotatividad
                    </h2>
                    <p className="text-xs text-slate-500">
                      Consulta los artículos de mayor movimiento diario, semanal, mensual, anual o por rango de fechas
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-1.5 bg-slate-100 p-1 rounded-xl">
                    {[
                      { id: 'TODAY', label: 'Diario' },
                      { id: 'WEEK', label: 'Semanal' },
                      { id: 'MONTH', label: 'Mensual' },
                      { id: 'YEAR', label: 'Anual' },
                      { id: 'CUSTOM', label: 'Fechas Específicas' },
                      { id: 'ALL', label: 'Todo' },
                    ].map((p) => (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => setRotPeriod(p.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-extrabold transition cursor-pointer ${
                          rotPeriod === p.id
                            ? 'bg-emerald-600 text-white shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                {rotPeriod === 'CUSTOM' && (
                  <div className="flex flex-wrap items-center gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Desde:</label>
                      <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-xl bg-white" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Hasta:</label>
                      <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-xl bg-white" />
                    </div>
                  </div>
                )}

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 text-[11px] font-extrabold uppercase text-slate-500 bg-slate-50">
                        <th className="py-3 px-3">Ranking / Producto</th>
                        <th className="py-3 px-3">Departamento</th>
                        <th className="py-3 px-3">Cantidad Vendida</th>
                        <th className="py-3 px-3">Nivel de Rotación</th>
                        <th className="py-3 px-3 text-right">Ingresos ($)</th>
                        <th className="py-3 px-3 text-right">Ganancia ($)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-xs">
                      {rotationList.map((item, idx) => (
                        <tr key={item.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-bold text-slate-900">
                            <span className={`inline-block w-6 text-center mr-1.5 font-black ${idx < 3 && item.qtySold > 0 ? 'text-amber-600' : 'text-slate-400'}`}>

                          <td className="py-3 px-3 text-right font-extrabold text-emerald-700">{formatUsd(item.profitUsd)}</td>
                        </tr>

        function FixedExpensesTab({
          settings,
          fixedExpenses,

          fixedHistory,

          const [expName, setExpName] = useState('');
          const [expCategory, setExpCategory] = useState('Luz');
          const [expMonthlyUsd, setExpMonthlyUsd] = useState('');
          const [expDueDay, setExpDueDay] = useState('15');

          const currentMonthKey = new Date().toISOString().slice(0, 7);

          const totalPayrollMonthlyUsd = useMemo(() => {
            return employees
              .filter((e) => e.active !== false)
              .reduce((acc, e) => {
                const mult = e.payFrequency === 'WEEKLY' ? 4 : e.payFrequency === 'BIWEEKLY' ? 2 : 1;
                return acc + e.baseSalaryUsd * mult;
              }, 0);
          }, [employees]);

          const accountingFeeUsd = useMemo(() => {
            return fixedExpenses
              .filter((f) => f.category === 'Contable')
              .reduce((acc, f) => acc + f.monthlyAmountUsd, 0);
          }, [fixedExpenses]);

          const totals = useMemo(() => {
            const totalFixed = fixedExpenses.reduce((acc, f) => acc + f.monthlyAmountUsd, 0);
            const totalPaid = fixedExpenses.reduce((acc, f) => acc + Math.min(f.monthlyAmountUsd, f.paidThisMonthUsd || 0), 0);
            const totalRemaining = Math.max(0, round3(totalFixed - totalPaid));
            return { totalFixed, totalPaid, totalRemaining };
          }, [fixedExpenses]);

          const handleCreateFixedExpense = (e) => {
            e.preventDefault();
            if (!expName.trim() || !expMonthlyUsd) return;
            const newExp = {
              id: `fix-${Date.now()}`,
              name: expName.trim(),
              category: expCategory,
              monthlyAmountUsd: Number(expMonthlyUsd),
              paidThisMonthUsd: 0,
              dueDay: Number(expDueDay) || 15,
            };
            setFixedExpenses([...fixedExpenses, newExp]);
            setExpName('');
            setExpMonthlyUsd('');
            showToast('Pago fijo mensual agregado');
          };

          const handlePayFixed = (item, customAmt = null) => {
            const remaining = Math.max(0, round3(item.monthlyAmountUsd - (item.paidThisMonthUsd || 0)));
            const parsedCustom = customAmt !== null ? Number(String(customAmt).replace(',', '.')) : null;
            if (customAmt !== null && (!parsedCustom || parsedCustom <= 0)) {
              showToast('Ingresa un monto de abono válido mayor a 0', 'warning');
              return;
            }
            const payNow = parsedCustom !== null ? Math.min(remaining, round3(parsedCustom)) : remaining;
            if (!payNow || payNow <= 0) return;

            const nextPaid = round3((item.paidThisMonthUsd || 0) + payNow);
            const newRemaining = Math.max(0, round3(item.monthlyAmountUsd - nextPaid));

            setFixedExpenses(
              fixedExpenses.map((f) =>
                f.id === item.id ? { ...f, paidThisMonthUsd: nextPaid } : f
              )
            );

            const historyEntry = {
              id: `fhist-${Date.now()}`,
              date: new Date().toISOString(),
              expenseName: item.name,
              category: item.category,
              amountUsd: payNow,
              remainingUsd: newRemaining,
              monthKey: currentMonthKey,
              notes: newRemaining === 0 ? 'Pago completo del mes' : 'Abono parcial mensual',
            };
            setFixedHistory([historyEntry, ...fixedHistory]);

            setCashMovements([
              {
                id: `MOV-${Date.now()}`,
                date: new Date().toISOString(),
                type: 'OUT',
                category: `Pago Fijo: ${item.category}`,
                description: `${item.name} (${newRemaining === 0 ? 'Liquidado' : 'Abono'})`,
                amountUsd: payNow,
                currencyUsed: 'USD',
              },
              ...cashMovements,
            ]);

            setAbonoInputs((prev) => ({ ...prev, [item.id]: '' }));
            showToast(`✅ Pago de ${formatUsd(payNow)} registrado en ${item.name}. Resta: ${formatUsd(newRemaining)}`);
          };

          const handleResetNewMonth = () => {
            setFixedExpenses(fixedExpenses.map((f) => ({ ...f, paidThisMonthUsd: 0 })));

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div className="bg-white p-4 rounded-3xl border border-slate-200">
                  <span className="text-[11px] font-bold text-slate-500">TOTAL PAGOS FIJOS MES</span>
                  <p className="text-xl font-black text-slate-900 mt-1">{formatUsd(totals.totalFixed)}</p>
                </div>
                <div className="bg-white p-4 rounded-3xl border border-slate-200">
                  <span className="text-[11px] font-bold text-slate-500">ABONADO ESTE MES</span>

                <div className="bg-slate-900 text-white p-4 rounded-3xl">
                  <span className="text-[11px] font-bold text-amber-400">NÓMINA MENSUAL EST.</span>
                  <p className="text-xl font-black mt-1">{formatUsd(totalPayrollMonthlyUsd)}</p>
                </div>
                <div className="bg-slate-900 text-white p-4 rounded-3xl">
                  <span className="text-[11px] font-bold text-sky-400">HONORARIOS CONTABLE</span>
                  <p className="text-xl font-black mt-1">{formatUsd(accountingFeeUsd)}</p>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <form onSubmit={handleCreateFixedExpense} className="lg:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 space-y-3 h-fit">
                  <h3 className="font-extrabold text-slate-900 text-sm">Agregar Obligación / Pago Fijo Mensual</h3>
                  <select value={expCategory} onChange={(e) => setExpCategory(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold">
                    <option value="Luz">💡 Luz / Electricidad</option>
                    <option value="Agua">💧 Agua</option>
                    <option value="Internet">🌐 Internet / Telefonía</option>
                    <option value="Alquiler">🏢 Alquiler de Local</option>
                    <option value="Impuestos Alcaldía">🏛️ Impuestos de Alcaldía</option>
                    <option value="Impuestos SENIAT">🧾 Impuestos de SENIAT</option>
                    <option value="Otros Impuestos">📑 Otro Tipo de Impuestos</option>
                    <option value="Contable">📊 Contable / Contador</option>
                    <option value="Otros">📌 Otro Gasto Fijo</option>
                  </select>
                  <input type="text" placeholder="Descripción (Ej: Impuesto Trimestral Alcaldía)" value={expName} onChange={(e) => setExpName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" step="0.01" placeholder="Monto Mensual ($)" value={expMonthlyUsd} onChange={(e) => setExpMonthlyUsd(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" required />
                    <input type="number" min="1" max="31" placeholder="Día corte (1-31)" value={expDueDay} onChange={(e) => setExpDueDay(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                    + Guardar Pago Fijo
                  </button>
                </form>

                <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h3 className="font-extrabold text-slate-900">Control Mensual de Servicios, Impuestos y Contable</h3>
                    <button
                      type="button"
                      onClick={handleResetNewMonth}
                      className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer"
                    >
                      🔄 Iniciar Nuevo Mes
                    </button>
                  </div>

                  <div className="space-y-2.5">
                    {fixedExpenses.map((item) => {
                      const paid = Number(item.paidThisMonthUsd || 0);
                      const remaining = Math.max(0, round3(item.monthlyAmountUsd - paid));
                      const isDone = remaining <= 0;
                      const isPartial = !isDone && paid > 0;

                      return (
                        <div key={item.id} className={`p-3.5 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${isDone ? 'bg-emerald-50/50 border-emerald-200' : isPartial ? 'bg-amber-50/40 border-amber-300' : 'bg-slate-50 border-slate-200'}`}>
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="font-extrabold text-slate-900 text-sm">{item.name}</span>
                              <span className="px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 text-[10px] font-bold">{item.category}</span>
                              {isDone ? (
                                <span className="px-2.5 py-0.5 rounded-full bg-emerald-600 text-white text-[10px] font-extrabold">✓ LISTO / PAGADO</span>
                              ) : isPartial ? (
                                <span className="px-2.5 py-0.5 rounded-full bg-amber-500 text-white text-[10px] font-extrabold">⏳ ABONADO (FALTA {formatUsd(remaining)})</span>
                              ) : (
                                <span className="px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700 text-[10px] font-extrabold">PENDIENTE</span>
                              )}
                            </div>
                            <div className="flex flex-wrap gap-4 text-xs mt-1">
                              <span>Mensual: <strong>{formatUsd(item.monthlyAmountUsd)}</strong></span>
                              <span className="text-emerald-700">Abonado: <strong>{formatUsd(paid)}</strong></span>
                              <span className="text-red-600">Falta por Pagar: <strong>{formatUsd(remaining)}</strong></span>
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5">
                            {!isDone && (
                              <>
                                <input
                                  type="number"
                                  step="0.01"
                                  placeholder="Abono $"
                                  value={abonoInputs[item.id] || ''}
                                  onChange={(e) => setAbonoInputs({ ...abonoInputs, [item.id]: e.target.value })}
                                  className="w-20 px-2 py-1.5 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                                />
                                <button

                                  onClick={() => handlePayFixed(item, null)}

                                >
                                  Pagar Todo

                            )}
                            <button

                              onClick={() => setFixedExpenses(fixedExpenses.filter((f) => f.id !== item.id))}
                              className="p-1.5 bg-red-50 text-red-600 rounded-xl cursor-pointer"

                            >

        function AnalyticsAndCustomersTab({ settings, sales, customers, cashMovements = [], employees = [], fixedHistory = [] }) {
          const [period, setPeriod] = useState('ALL');
          const [startDate, setStartDate] = useState('');
          const [endDate, setEndDate] = useState('');

          const isDateInPeriod = (dateIso) => {
            const now = new Date();
            const d = new Date(dateIso);
            const diffDays = (now - d) / (1000 * 60 * 60 * 24);
            if (period === 'TODAY') return d.toDateString() === now.toDateString();
            if (period === 'WEEK') return diffDays <= 7;
            if (period === 'MONTH') return diffDays <= 30;
            if (period === 'YEAR') return diffDays <= 365;
            if (period === 'CUSTOM') {
              const str = d.toISOString().slice(0, 10);
              if (startDate && str < startDate) return false;
              if (endDate && str > endDate) return false;
              return true;
            }
            return true;
          };

          const filteredSales = useMemo(() => {
            return sales.filter((s) => {
              const st = s.status || 'COMPLETED';
              if (st !== 'COMPLETED') return false;
              return isDateInPeriod(s.date);
            });
          }, [sales, period, startDate, endDate]);

          const filteredMovements = useMemo(() => {
            return cashMovements.filter((m) => isDateInPeriod(m.date));
          }, [cashMovements, period, startDate, endDate]);

          const kpis = useMemo(() => {
            const totalSalesUsd = filteredSales.reduce((acc, s) => acc + s.totalUsd, 0);
            const totalCostUsd = filteredSales.reduce((acc, s) => acc + (s.totalCostUsd || 0), 0);
            const grossProfitUsd = totalSalesUsd - totalCostUsd;

            const salariesPaidUsd = filteredMovements
              .filter((m) => m.type === 'OUT' && (m.category || '').includes('Nómina'))
              .reduce((acc, m) => acc + m.amountUsd, 0);

            const ownerWithdrawalsUsd = filteredMovements
              .filter((m) => m.type === 'OUT' && (m.category || '').includes('Retiro'))
              .reduce((acc, m) => acc + m.amountUsd, 0);

            const supplierAndFixedPaymentsUsd = filteredMovements
              .filter(
                (m) =>
                  m.type === 'OUT' &&
                  !(m.category || '').includes('Nómina') &&
                  !(m.category || '').includes('Retiro')
              )
              .reduce((acc, m) => acc + m.amountUsd, 0);

            const totalExpensesUsd = round3(salariesPaidUsd + supplierAndFixedPaymentsUsd);
            const netProfitAfterExpensesUsd = round3(grossProfitUsd - totalExpensesUsd);
            const marginPercent = totalSalesUsd > 0 ? (grossProfitUsd / totalSalesUsd) * 100 : 0;

            return {
              totalSalesUsd,
              totalCostUsd,
              grossProfitUsd,
              salariesPaidUsd,
              ownerWithdrawalsUsd,
              supplierAndFixedPaymentsUsd,
              totalExpensesUsd,
              netProfitAfterExpensesUsd,
              marginPercent,
              onlineCount: filteredSales.filter((s) => s.channel === 'ONLINE').length,
              posCount: filteredSales.filter((s) => s.channel === 'POS').length,
              totalOrders: filteredSales.length,
            };
          }, [filteredSales, filteredMovements]);

          const chartBars = [
            { label: 'Ventas Totales', val: kpis.totalSalesUsd, color: 'bg-emerald-600' },
            { label: 'Ganancia Bruta', val: kpis.grossProfitUsd, color: 'bg-amber-500' },
            { label: 'Pagos / Gastos', val: kpis.supplierAndFixedPaymentsUsd, color: 'bg-rose-500' },
            { label: 'Sueldos / Nómina', val: kpis.salariesPaidUsd, color: 'bg-sky-600' },
            { label: 'Retiros de Caja', val: kpis.ownerWithdrawalsUsd, color: 'bg-purple-600' },
          ];
          const maxChartVal = Math.max(1, ...chartBars.map((b) => b.val));

          const customerRanking = useMemo(() => {
            const map = {};
            sales.forEach((s) => {
              if (!s.customerCi || s.customerCi === 'CLIENTE-GENERAL') return;
              if ((s.status || 'COMPLETED') !== 'COMPLETED') return;
              if (!map[s.customerCi]) {
                const profile = customers.find((c) => c.ci === s.customerCi);
                map[s.customerCi] = {
                  ci: s.customerCi,
                  name: profile ? `${profile.firstName} ${profile.lastName}` : s.customerName,
                  phone: profile?.phone || s.customerPhone,
                  address: profile?.address || s.customerAddress,
                  photo: profile?.photo || null,
                  ordersCount: 0,
                  totalSpentUsd: 0,
                  lastPurchase: s.date,
                };
              }
              map[s.customerCi].ordersCount += 1;
              map[s.customerCi].totalSpentUsd += s.totalUsd;
              if (new Date(s.date) > new Date(map[s.customerCi].lastPurchase)) {
                map[s.customerCi].lastPurchase = s.date;
              }
            });
            customers.forEach((c) => {
              if (!map[c.ci]) {
                map[c.ci] = {
                  ci: c.ci,
                  name: `${c.firstName} ${c.lastName}`,
                  phone: c.phone,
                  address: c.address,
                  photo: c.photo,
                  ordersCount: 0,
                  totalSpentUsd: 0,
                  lastPurchase: null,
                };
              }
            });
            return Object.values(map).sort((a, b) => b.totalSpentUsd - a.totalSpentUsd);
          }, [sales, customers]);

          return (
            <div className="space-y-6">
              <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900">
                      Resumen Financiero Integral, Gráficas y Auditoría por Fecha
                    </h2>
                    <p className="text-xs text-slate-500">
                      Filtra ventas, gastos, sueldos, pagos, ganancias y retiros de caja por día, semana, mes, año o fechas específicas
                    </p>
                  </div>

                  <div className="flex flex-wrap gap-1.5 bg-slate-100 p-1 rounded-xl">
                    {[
                      { id: 'TODAY', label: 'Día (Hoy)' },
                      { id: 'WEEK', label: 'Semanal' },
                      { id: 'MONTH', label: 'Mensual' },
                      { id: 'YEAR', label: 'Anual' },
                      { id: 'CUSTOM', label: 'Fechas Específicas' },
                      { id: 'ALL', label: 'Todo' },
                    ].map((p) => (
                      <button
                        key={p.id}
                        onClick={() => setPeriod(p.id)}

                            ? 'bg-emerald-600 text-white shadow-xs'

                  </div>
                </div>

                {period === 'CUSTOM' && (

                      <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl bg-white font-semibold" />

                      <label className="font-bold text-slate-700 block mb-1">Fecha Final:</label>
                      <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl bg-white font-semibold" />

                  <span className="text-xs font-bold text-slate-500">TOTAL VENTAS COBRADAS</span>
                  <p className="text-2xl font-black text-slate-900 mt-1">{formatUsd(kpis.totalSalesUsd)}</p>
                  <p className="text-xs font-semibold text-emerald-700 mt-0.5">{formatBs(kpis.totalSalesUsd * settings.exchangeRate)}</p>

                  <p className="text-2xl font-black text-amber-300 mt-1">{formatUsd(kpis.grossProfitUsd)}</p>

                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">

                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-xs">

                    <span className="text-slate-700 bg-slate-100 px-2 py-0.5 rounded">Caja: {kpis.posCount}</span>

                <div className="space-y-3">

                      <div className="w-full h-4 bg-slate-100 rounded-full overflow-hidden">

                          style={{ width: `${Math.max(2, Math.round((b.val / maxChartVal) * 100))}%` }}

                    </div>

                </div>
              </div>

              {/* Historial Detallado de Movimientos del Período */}

                      <div>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold mr-2 ${m.type === 'IN' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}`}>
                          {m.type === 'IN' ? 'INGRESO' : 'EGRESO'}
                        </span>
                        <strong className="text-slate-900">{m.category}</strong>
                        <p className="text-slate-500 mt-0.5">{m.description} • {new Date(m.date).toLocaleString('es-VE')}</p>
                      </div>
                      <span className={`font-black text-sm ${m.type === 'IN' ? 'text-emerald-600' : 'text-red-600'}`}>
                        {m.type === 'IN' ? '+' : '-'}{formatUsd(m.amountUsd)}

                    </div>

              </div>

                  </div>

                    {customerRanking.length} clientes registrados
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">

                      <tr className="border-b border-slate-200 text-[11px] font-extrabold uppercase text-slate-500 bg-slate-50">

                        <th className="py-3 px-3">Cédula (CI)</th>
                        <th className="py-3 px-3">Teléfono / Ubicación</th>
                        <th className="py-3 px-3 text-center">Compras</th>
                        <th className="py-3 px-3 text-right">Total Comprado ($)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-xs">
                      {customerRanking.map((c, idx) => (
                        <tr key={c.ci} className="hover:bg-slate-50">
                          <td className="py-3 px-3">
                            <div className="flex items-center gap-2.5">
                              {c.photo ? (
                                <img src={c.photo} alt={c.name} className="w-8 h-8 rounded-full object-cover border border-emerald-500" />
                              ) : (
                                <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-extrabold">
                                  {c.name[0]}
                                </div>
                              )}
                              <div>
                                <p className="font-bold text-slate-900 flex items-center gap-1.5">
                                  {c.name}
                                  {idx === 0 && c.totalSpentUsd > 0 && (
                                    <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-extrabold">TOP #1</span>
                                  )}
                                </p>
                                <span className="text-[10px] text-slate-400">
                                  {c.lastPurchase ? `Última compra: ${new Date(c.lastPurchase).toLocaleDateString()}` : 'Sin compras aún'}
                                </span>
                              </div>
                            </div>
                          </td>
                          <td className="py-3 px-3 font-extrabold text-slate-700">{c.ci}</td>
                          <td className="py-3 px-3">
                            <p className="font-semibold text-slate-700">{c.phone}</p>
                            <p className="text-[11px] text-slate-400 truncate max-w-xs">{c.address}</p>
                          </td>
                          <td className="py-3 px-3 text-center">
                            <span className="px-2.5 py-1 rounded-full bg-slate-100 font-extrabold text-slate-800">{c.ordersCount}</span>
                          </td>
                          <td className="py-3 px-3 text-right">
                            <span className="font-black text-emerald-700 text-sm block">{formatUsd(c.totalSpentUsd)}</span>
                            <span className="text-[10px] text-slate-400">{formatBs(c.totalSpentUsd * settings.exchangeRate)}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        }

        const COLOR_PRESETS = [
          { name: 'Esmeralda Clásico', primary: '#059669', accent: '#f59e0b', header: '#064e3b', bg: '#f8fafc' },
          { name: 'Azul Corporativo', primary: '#2563eb', accent: '#f59e0b', header: '#1e3a8a', bg: '#f1f5f9' },
          { name: 'Rojo Comercial', primary: '#dc2626', accent: '#fbbf24', header: '#7f1d1d', bg: '#fef2f2' },
          { name: 'Morado Moderno', primary: '#7c3aed', accent: '#10b981', header: '#4c1d95', bg: '#faf5ff' },
          { name: 'Naranja Energético', primary: '#ea580c', accent: '#0ea5e9', header: '#7c2d12', bg: '#fff7ed' },
          { name: 'Dorado & Negro Lujo', primary: '#b45309', accent: '#f59e0b', header: '#09090b', bg: '#fafaf9' },
        ];

        function StoreSettingsTab({ settings, setSettings, showToast }) {
          const [form, setForm] = useState(settings);
          const [showAdminPin, setShowAdminPin] = useState(false);
          const logoInputRef = useRef(null);

          useEffect(() => {
            setForm(settings);
          }, [settings]);

          const handleLogoUpload = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              const compressedLogo = await compressImageFile(file, 300, 0.85);
              setForm((prev) => ({ ...prev, storeLogo: compressedLogo }));
              showToast('Logo cargado. Haz clic en Guardar Diseño y Configuración para aplicarlo.');
            } catch (err) {
              showToast('No se pudo cargar el logo', 'error');
            }
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            if (!form.adminPin || form.adminPin.trim().length < 6) {
              showToast('El PIN de administrador debe tener al menos 6 caracteres para mayor seguridad', 'warning');
              return;
            }

            setSettings({
              ...form,
              exchangeRate: Math.max(1, Number(form.exchangeRate)),
              freeDeliveryThreshold: Math.max(0, Number(form.freeDeliveryThreshold)),
              deliveryFee: Math.max(0, Number(form.deliveryFee)),
              mobileColumns: Number(form.mobileColumns) === 1 ? 1 : 2,
              adminPin: form.adminPin.trim(),
            });
            showToast('✅ ¡Diseño, colores, textos y configuración guardados en la nube!');
          };

          return (
            <div className="max-w-4xl bg-white rounded-3xl border border-slate-200 p-6 shadow-xs space-y-6">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">
                    Editor Visual de Interfaz, Marca, Tasa y Seguridad
                  </h2>
                  <p className="text-xs text-slate-500">
                    Edita los colores, textos de portada, cintillo de anuncios, columnas en móvil, logo y tasa con 1 clic
                  </p>
                </div>
              </div>

              <div className="rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                {form.topBannerActive && (
                  <div
                    style={{ backgroundColor: form.accentColor || '#f59e0b' }}
                    className="text-slate-950 text-[11px] font-extrabold py-1 px-3 text-center"
                  >
                    {form.topBannerText || 'Cintillo promocional superior'}
                  </div>
                )}
                <div
                  style={{
                    background: `linear-gradient(120deg, ${form.headerColor || '#064e3b'} 0%, ${
                      form.primaryColor || '#059669'
                    } 100%)`,
                  }}
                  className="p-4 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-3"
                >
                  <div className="space-y-1">
                    <span
                      style={{ backgroundColor: form.accentColor || '#f59e0b' }}
                      className="inline-block text-slate-950 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase"
                    >
                      {form.heroBadgeText || 'Etiqueta Superior'}
                    </span>
                    <h4 className="font-extrabold text-base leading-tight">
                      {form.heroTitle || 'Título Principal de Portada'}
                    </h4>
                    <p className="text-xs text-white/85 line-clamp-1">
                      {form.heroSubtitle || 'Subtítulo descriptivo de la tienda'}
                    </p>
                  </div>
                  <div className="shrink-0 bg-white/15 backdrop-blur-xs px-3 py-2 rounded-xl border border-white/20 text-xs">
                    <span className="block text-[10px] uppercase text-white/75">Vista Previa</span>
                    <strong>{form.storeName}</strong>
                  </div>
                </div>
              </div>

              <form onSubmit={handleSaveSettings} className="space-y-6 text-sm">
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">

                  </h3>

                  <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <div className="w-20 h-20 rounded-2xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shadow-2xs shrink-0">
                      {form.storeLogo ? (
                        <img
                          src={form.storeLogo}
                          alt="Logo"
                          className="w-full h-full object-cover"

                        <ShoppingBag className="w-9 h-9 text-slate-400" />

                      <p className="text-[11px] text-slate-500">

                      </p>
                      <input
                        ref={logoInputRef}
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        onChange={handleLogoUpload}
                        className="hidden"
                      />
                      <div className="flex items-center gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => logoInputRef.current?.click()}
                          className="px-3.5 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 cursor-pointer"

                          Subir Logo JPG/PNG
