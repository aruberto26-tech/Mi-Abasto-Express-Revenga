        // ============================================================================
        // MÓDULO NUEVO: GESTIÓN DE FACTURAS, BÚSQUEDA POR CÉDULA, PESAJE REAL Y ANULACIÓN
        // ============================================================================
        function OrdersAndInvoicesTab({
          settings,
          products,
          customers,
          sales,
          cashMovements,
          updateCloud,
          showToast,
        }) {
          const [searchTerm, setSearchTerm] = useState('');
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [editingOrder, setEditingOrder] = useState(null);

          const filteredOrders = useMemo(() => {
            const q = searchTerm.trim().toLowerCase();
            return sales.filter((s) => {
              const st = s.status || 'COMPLETED';
              if (statusFilter !== 'ALL' && st !== statusFilter) return false;
              if (!q) return true;
              return (
                (s.id || '').toLowerCase().includes(q) ||
                (s.customerCi || '').toLowerCase().includes(q) ||
                (s.customerName || '').toLowerCase().includes(q) ||
                (s.customerPhone || '').toLowerCase().includes(q)
              );
            });
          }, [sales, searchTerm, statusFilter]);

          // Datos del cliente encontrado si el admin busca por cédula
          const searchedCustomerProfile = useMemo(() => {
            const q = searchTerm.trim().toUpperCase();
            if (q.length < 4) return null;
            return (
              customers.find(
                (c) =>
                  c.ci.toUpperCase().includes(q) ||
                  `${c.firstName} ${c.lastName}`.toUpperCase().includes(q)
              ) || null
            );
          }, [customers, searchTerm]);

          const openOrderEditor = (order) => {
            setEditingOrder(JSON.parse(JSON.stringify(order)));
          };

          const handleUpdateItemQtyInOrder = (idx, rawValue, isMinorInput = false) => {
            const val = Number(rawValue);
            if (isNaN(val) || val < 0) return;

            setEditingOrder((prev) => {
              const updatedItems = [...prev.items];
              const item = { ...updatedItems[idx] };
              const prod = products.find((p) => p.id === item.productId);
              const saleMode = item.saleMode || (prod ? getProductSaleMode(prod) : 'UNIT');

              const nextQty = isMinorInput ? round3(val / 1000) : round3(val);
              item.qty = nextQty;

              // Recalcular si aplica precio mayor o detal según nueva cantidad/peso
              if (prod) {
                const isWholesale = nextQty >= prod.wholesaleMinQty;
                item.isWholesale = isWholesale;
                item.unitPrice = isWholesale ? prod.wholesalePrice : prod.retailPrice;
                item.costPrice = prod.costPrice;
              }

              updatedItems[idx] = item;
              return recalculateOrderTotals({ ...prev, items: updatedItems });
            });
          };

          const handleRemoveItemFromOrder = (idx) => {
            setEditingOrder((prev) => {
              const updatedItems = prev.items.filter((_, i) => i !== idx);
              return recalculateOrderTotals({ ...prev, items: updatedItems });
            });
          };

          const recalculateOrderTotals = (orderObj) => {
            const validItems = orderObj.items.filter((i) => i.qty > 0);
            const subtotalUsd = round3(
              validItems.reduce((acc, i) => acc + i.qty * i.unitPrice, 0)
            );
            const totalCostUsd = round3(
              validItems.reduce((acc, i) => acc + i.qty * (i.costPrice || 0), 0)
            );
            const deliveryUsd =
              orderObj.channel === 'POS' || subtotalUsd === 0
                ? 0
                : subtotalUsd >= settings.freeDeliveryThreshold
                ? 0
                : Number(settings.deliveryFee);

            const totalUsd = round3(subtotalUsd + deliveryUsd);
            const rate = orderObj.exchangeRate || settings.exchangeRate;
            const totalBs = totalUsd * rate;

            return {
              ...orderObj,
              items: validItems,
              subtotalUsd,
              deliveryUsd,
              totalUsd,
              totalCostUsd,
              totalBs,
            };
          };

          const handleSaveEditedOrder = () => {
            if (!editingOrder) return;
            if (editingOrder.items.length === 0) {
              showToast('La factura quedó sin productos. Si deseas cancelarla, usa "Anular Pedido".', 'warning');
              return;
            }

            const originalOrder = sales.find((s) => s.id === editingOrder.id);
            if (!originalOrder) return;

            // Ajustar diferencias de inventario entre lo que estaba apartado y el peso/cantidad real
            const updatedProducts = products.map((p) => {
              const oldItem = originalOrder.items.find((i) => i.productId === p.id);
              const newItem = editingOrder.items.find((i) => i.productId === p.id);
              const oldQty = oldItem ? oldItem.qty : 0;
              const newQty = newItem ? newItem.qty : 0;
              const delta = round3(newQty - oldQty); // positivo = se vendió más peso; negativo = se devolvió al stock
              if (delta === 0) return p;
              return { ...p, stock: Math.max(0, round3(p.stock - delta)) };
            });

            const updatedSales = sales.map((s) =>
              s.id === editingOrder.id ? editingOrder : s
            );

            updateCloud({
              products: updatedProducts,
              sales: updatedSales,
            });

            setEditingOrder(null);
            showToast(`✅ Factura ${editingOrder.id} actualizada y stock reajustado`);
          };

          const handleFinalizeOrder = (order) => {
            const st = order.status || 'COMPLETED';
            if (st === 'COMPLETED') return;

            const updatedSales = sales.map((s) =>
              s.id === order.id
                ? { ...s, status: 'COMPLETED', finalizedAt: new Date().toISOString() }
                : s
            );

            // Registrar ingreso formal en caja al finalizar el pago
            const updatedMovements = [
              {
                id: `MOV-${Date.now()}`,
                date: new Date().toISOString(),
                type: 'IN',
                category: `Cobro Orden ${order.id} (${order.paymentMethod})`,
                description: `Cliente: ${order.customerName} (${order.customerCi})`,
                amountUsd: order.totalUsd,
                currencyUsed: (order.paymentMethod || '').includes('Bs') ? 'BS' : 'USD',
              },
              ...cashMovements,
            ];

            updateCloud({
              sales: updatedSales,
              cashMovements: updatedMovements,
            });

            if (editingOrder?.id === order.id) {
              setEditingOrder(null);
            }

            showToast(`🎉 Orden ${order.id} marcada como FINALIZADA y sumada a caja`);
          };

          const handleCancelOrder = (order) => {
            const st = order.status || 'COMPLETED';
            if (st === 'CANCELLED') return;

            // Devolver todo el stock (unidades, kilos o litros) al inventario
            const updatedProducts = products.map((p) => {
              const item = order.items.find((i) => i.productId === p.id);
              if (!item) return p;
              return { ...p, stock: round3(p.stock + item.qty) };
            });

            const updatedSales = sales.map((s) =>
              s.id === order.id
                ? { ...s, status: 'CANCELLED', cancelledAt: new Date().toISOString() }
                : s
            );

            // Si la orden ya había entrado a caja, registrar reverso de salida
            let updatedMovements = cashMovements;
            if (st === 'COMPLETED') {
              updatedMovements = [
                {
                  id: `MOV-${Date.now()}`,
                  date: new Date().toISOString(),
                  type: 'OUT',
                  category: `Anulación de Factura ${order.id}`,
                  description: `Devolución / Anulación orden de ${order.customerName}`,
                  amountUsd: order.totalUsd,
                  currencyUsed: 'USD',
                },
                ...cashMovements,
              ];
            }

            updateCloud({
              products: updatedProducts,
              sales: updatedSales,
              cashMovements: updatedMovements,
            });

            if (editingOrder?.id === order.id) {
              setEditingOrder(null);
            }

            showToast(`🔴 Orden ${order.id} ANULADA. El stock fue devuelto al inventario.`, 'info');
          };

          const buildUpdatedWhatsAppUrl = (order) => {
            const itemsText = order.items
              .map((i) => {
                const prod = products.find((p) => p.id === i.productId);
                const mode = i.saleMode || (prod ? getProductSaleMode(prod) : 'UNIT');
                return `• ${formatMeasureQty(i.qty, mode)} de ${i.name} (${
                  i.isWholesale ? 'Mayor' : 'Detal'
                }) = ${formatUsd(i.qty * i.unitPrice)}`;
              })
              .join('\n');

            const rate = order.exchangeRate || settings.exchangeRate;
            const msg =
              `🧾 *FACTURA EXACTA VERIFICADA - ${settings.storeName.toUpperCase()}*\n` +
              `📋 *Orden N°:* ${order.id}\n` +
              `👤 *Cliente:* ${order.customerName} (${order.customerCi})\n\n` +
              `⚖️ *DETALLE DEFINITIVO (PESO/MEDIDA REAL):*\n${itemsText}\n\n` +
              `🚚 *Delivery:* ${
                order.deliveryUsd === 0 ? 'GRATIS 🎉' : formatUsd(order.deliveryUsd)
              }\n` +
              `💵 *TOTAL EXACTO A PAGAR USD:* ${formatUsd(order.totalUsd)}\n` +
              `🇻🇪 *TOTAL EXACTO A PAGAR BS:* ${formatBs(order.totalUsd * rate)} _(Tasa: Bs. ${Number(
                rate
              ).toFixed(2)})_\n\n` +
              `¡Tu pedido ya está pesado y listo! Envíanos el comprobante de pago para despachar de inmediato.`;

            const clientPhoneDigits = (order.customerPhone || '').replace(/\D/g, '');
            const waTarget =
              clientPhoneDigits.length >= 10
                ? clientPhoneDigits.startsWith('0')
                  ? `58${clientPhoneDigits.slice(1)}`
                  : clientPhoneDigits
                : '';

            return `https://wa.me/${waTarget}?text=${encodeURIComponent(msg)}`;
          };

          return (
            <div className="space-y-6">
              <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-xs space-y-4">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                      <ClipboardList className="w-5 h-5 text-emerald-600" />
                      Control de Facturas, Pesaje Real y Órdenes por Cédula
                    </h2>
                    <p className="text-xs text-slate-500">
                      Busca por Cédula (CI) o N° de Orden, ajusta gramos/litros tras pesar, finaliza el pago o anula para reponer stock.
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    <div className="relative min-w-[250px] flex-1">
                      <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        placeholder="Buscar Cédula (V-...), Cliente u Orden..."
                        className="w-full pl-9 pr-8 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                      {searchTerm && (
                        <button
                          onClick={() => setSearchTerm('')}
                          className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 cursor-pointer"
                        >
                          <X className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* Filtros de Estado */}
                <div className="flex flex-wrap gap-2">
                  {[
                    { id: 'ALL', label: `Todas (${sales.length})` },
                    {
                      id: 'PENDING',
                      label: `🟡 Pendientes (${sales.filter((s) => s.status === 'PENDING').length})`,
                    },
                    {
                      id: 'COMPLETED',
                      label: `🟢 Finalizadas (${
                        sales.filter((s) => (s.status || 'COMPLETED') === 'COMPLETED').length
                      })`,
                    },
                    {
                      id: 'CANCELLED',
                      label: `🔴 Anuladas (${sales.filter((s) => s.status === 'CANCELLED').length})`,
                    },
                  ].map((st) => (
                    <button
                      key={st.id}
                      onClick={() => setStatusFilter(st.id)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${
                        statusFilter === st.id
                          ? 'bg-slate-900 text-white shadow-2xs'
                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                    >
                      {st.label}
                    </button>
                  ))}
                </div>

                {/* Ficha Completa del Cliente si se busca por Cédula o Nombre */}
                {searchedCustomerProfile && (
                  <div className="p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                      {searchedCustomerProfile.photo ? (
                        <img
                          src={searchedCustomerProfile.photo}
                          alt={searchedCustomerProfile.firstName}
                          className="w-12 h-12 rounded-full object-cover border-2 border-emerald-600"
                        />
                      ) : (
                        <div className="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center font-black text-lg">
                          {searchedCustomerProfile.firstName[0]}
                        </div>
                      )}
                      <div className="text-xs space-y-0.5">
                        <span className="text-[10px] font-extrabold uppercase text-emerald-700">
                          ✓ Ficha de Cliente Encontrada
                        </span>
                        <h4 className="font-extrabold text-slate-900 text-sm">
                          {searchedCustomerProfile.firstName} {searchedCustomerProfile.lastName} —{' '}
                          <span className="text-emerald-800">{searchedCustomerProfile.ci}</span>
                        </h4>
                        <p className="text-slate-600">
                          <strong>Tel:</strong> {searchedCustomerProfile.phone} •{' '}
                          <strong>Dirección:</strong> {searchedCustomerProfile.address}
                        </p>
                      </div>
                    </div>
                    <div className="text-right text-xs">
                      <span className="text-slate-500 block">Órdenes registradas:</span>
                      <strong className="text-base font-black text-emerald-800">
                        {sales.filter((s) => s.customerCi === searchedCustomerProfile.ci).length}
                      </strong>
                    </div>
                  </div>
                )}

                {/* Lista de Facturas / Órdenes */}
                <div className="space-y-3">
                  {filteredOrders.length === 0 ? (
                    <div className="py-12 text-center text-xs text-slate-400 bg-slate-50 rounded-2xl border border-slate-200">
                      No hay facturas u órdenes que coincidan con tu búsqueda.
                    </div>
                  ) : (
                    filteredOrders.map((order) => {
                      const status = order.status || 'COMPLETED';
                      const isPending = status === 'PENDING';
                      const isCancelled = status === 'CANCELLED';

                      return (
                        <div
                          key={order.id}
                          className={`p-4 rounded-2xl border transition ${
                            isPending
                              ? 'bg-amber-50/40 border-amber-300'
                              : isCancelled
                              ? 'bg-red-50/30 border-red-200 opacity-75'
                              : 'bg-white border-slate-200'
                          }`}
                        >
                          <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div className="space-y-1.5 flex-1">
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className="font-black text-slate-900 text-sm">{order.id}</span>
                                <span
                                  className={`px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${
                                    isPending
                                      ? 'bg-amber-400 text-slate-950'
                                      : isCancelled
                                      ? 'bg-red-100 text-red-700'
                                      : 'bg-emerald-100 text-emerald-800'
                                  }`}
                                >
                                  {isPending
                                    ? '🟡 PENDIENTE (Pesar / Cobrar)'
                                    : isCancelled
                                    ? '🔴 ANULADA (Stock Repuesto)'
                                    : '🟢 FINALIZADA / PAGADA'}
                                </span>
                                <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-bold">
                                  {order.channel === 'POS' ? 'Caja Física' : 'Web / WhatsApp'}
                                </span>
                                <span className="text-[11px] text-slate-400">
                                  {new Date(order.date).toLocaleString('es-VE')}
                                </span>
                              </div>

                              <div className="text-xs text-slate-700">
                                <strong>Cliente:</strong> {order.customerName} •{' '}
                                <strong>CI:</strong>{' '}
                                <span className="font-extrabold text-slate-900">{order.customerCi}</span> •{' '}
                                <strong>Tel:</strong> {order.customerPhone}
                                {order.customerAddress && order.customerAddress !== 'Tienda Física' && (
                                  <span className="block text-[11px] text-slate-500 mt-0.5">
                                    📍 {order.customerAddress}
                                  </span>
                                )}
                              </div>

                              <div className="flex flex-wrap gap-1.5 pt-1">
                                {order.items.map((item, idx) => {
                                  const prod = products.find((p) => p.id === item.productId);
                                  const mode =
                                    item.saleMode || (prod ? getProductSaleMode(prod) : 'UNIT');
                                  return (
                                    <span
                                      key={idx}
                                      className="inline-flex items-center gap-1 bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-lg text-[11px] font-semibold text-slate-800"
                                    >
                                      <strong>{formatMeasureQty(item.qty, mode)}</strong> {item.name} (
                                      {formatUsd(item.qty * item.unitPrice)})
                                    </span>
                                  );
                                })}
                              </div>
                            </div>

                            <div className="flex flex-col sm:flex-row lg:flex-col items-start sm:items-center lg:items-end justify-between gap-3 border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-200">
                              <div className="lg:text-right">
                                <span className="text-xs text-slate-500 block">
                                  {order.paymentMethod}
                                </span>
                                <span className="text-xl font-black text-slate-900">
                                  {formatUsd(order.totalUsd)}
                                </span>
                                <span className="block text-xs font-bold text-emerald-700">
                                  {formatBs(order.totalBs)}
                                </span>
                              </div>

                              {!isCancelled && (
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <button
                                    onClick={() => openOrderEditor(order)}
                                    className="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5 cursor-pointer"
                                    title="Ajustar peso real de balanza o quitar artículos"
                                  >
                                    <Scale className="w-3.5 h-3.5 text-amber-400" />
                                    Editar Peso / Factura
                                  </button>

                                  {order.channel === 'ONLINE' && (
                                    <a
                                      href={buildUpdatedWhatsAppUrl(order)}
                                      target="_blank"
                                      rel="noopener noreferrer"
                                      className="px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-bold flex items-center gap-1"
                                      title="Enviar factura exacta al WhatsApp del cliente"
                                    >
                                      <MessageCircle className="w-3.5 h-3.5" />
                                      WhatsApp
                                    </a>
                                  )}

                                  {isPending && (
                                    <button
                                      onClick={() => handleFinalizeOrder(order)}
                                      className="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center gap-1 shadow-xs cursor-pointer"
                                    >
                                      <CheckCircle2 className="w-3.5 h-3.5" />
                                      Finalizar Pago
                                    </button>
                                  )}

                                  {order.channel === 'ONLINE' && (
                                    <div className="flex flex-wrap items-center gap-1 w-full justify-end pt-1">
                                      {[
                                        { key: 'RECEIVED', label: '1. Recibido' },
                                        { key: 'PREPARING', label: '2. Preparando' },
                                        { key: 'ON_THE_WAY', label: '3. En Camino' },
                                        { key: 'DELIVERED', label: '4. Entregado' },
                                      ].map((stItem) => {
                                        const curStep =
                                          order.deliveryStep ||
                                          (status === 'COMPLETED' ? 'DELIVERED' : 'RECEIVED');
                                        const isCur = curStep === stItem.key;
                                        return (
                                          <button
                                            key={stItem.key}
                                            type="button"
                                            onClick={() => {
                                              const nextSales = sales.map((s) =>
                                                s.id === order.id ? { ...s, deliveryStep: stItem.key } : s
                                              );
                                              updateCloud({ sales: nextSales });
                                              showToast(`Estatus actualizado: ${stItem.label}`);
                                            }}
                                            className={`px-2 py-1 rounded-lg text-[10px] font-extrabold border transition cursor-pointer ${
                                              isCur
                                                ? 'bg-emerald-600 text-white border-emerald-600'
                                                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'
                                            }`}
                                          >
                                            {stItem.label}
                                          </button>
                                        );
                                      })}
                                    </div>
                                  )}

                                  <button
                                    onClick={() => handleCancelOrder(order)}
                                    className="px-3 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold flex items-center gap-1 cursor-pointer"
                                    title="Anular factura y devolver productos al stock"
                                  >
                                    <XCircle className="w-3.5 h-3.5" />
                                    Anular
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

              {/* MODAL EDITOR POST-PESAJE / AJUSTE DE FACTURA */}
              {editingOrder && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4 overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden my-8">
                    <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <Scale className="w-6 h-6 text-amber-400" />
                        <div>
                          <h3 className="font-extrabold text-base">
                            Ajustar Pesaje / Editar Factura {editingOrder.id}
                          </h3>
                          <p className="text-xs text-slate-300">
                            Cliente: {editingOrder.customerName} ({editingOrder.customerCi})
                          </p>
                        </div>
                      </div>
                      <button
                        onClick={() => setEditingOrder(null)}
                        className="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white cursor-pointer"
                      >
                        <X className="w-4 h-4" />
                      </button>
                    </div>

                    <div className="p-6 space-y-4 max-h-[80vh] overflow-y-auto text-xs">
                      <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 flex items-start gap-2">
                        <Info className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
                        <span>
                          Coloca el <strong>peso exacto en gramos (g)</strong> o{' '}
                          <strong>volumen en mililitros (mL)</strong> que dio la balanza, o elimina algún producto sin stock. El total y el inventario se recalcularán automáticamente.
                        </span>
                      </div>

                      <div className="space-y-2.5">
                        {editingOrder.items.map((item, idx) => {
                          const prod = products.find((p) => p.id === item.productId);
                          const mode =
                            item.saleMode || (prod ? getProductSaleMode(prod) : 'UNIT');
                          const isMeasured = mode === 'WEIGHT' || mode === 'VOLUME';
                          const minorVal = Math.round(item.qty * 1000);

                          return (
                            <div
                              key={idx}
                              className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3"
                            >
                              <div className="flex-1 min-w-0">
                                <p className="font-extrabold text-slate-900 text-sm">{item.name}</p>
                                <p className="text-[11px] text-slate-500">
                                  Precio aplicado: <strong>{formatUsd(item.unitPrice)}</strong>{' '}
                                  {formatBasePriceLabel(mode)} •{' '}
                                  {item.isWholesale ? (
                                    <span className="text-emerald-700 font-bold">Tarifa Mayor</span>
                                  ) : (
                                    <span>Tarifa Detal</span>
                                  )}
                                </p>
                              </div>

                              <div className="flex items-center gap-2">
                                {isMeasured ? (
                                  <div className="flex items-center gap-1.5">
                                    <input
                                      type="number"
                                      min="1"
                                      step="1"
                                      value={minorVal}
                                      onChange={(e) =>
                                        handleUpdateItemQtyInOrder(idx, e.target.value, true)
                                      }
                                      className="w-24 px-2.5 py-2 border-2 border-amber-400 rounded-xl bg-white font-black text-slate-900 text-right"
                                    />
                                    <span className="font-extrabold text-slate-700">
                                      {mode === 'WEIGHT' ? 'g' : 'mL'} ({item.qty.toFixed(3)}{' '}
                                      {mode === 'WEIGHT' ? 'Kg' : 'Lt'})
                                    </span>
                                  </div>
                                ) : (
                                  <div className="flex items-center gap-1.5">
                                    <input
                                      type="number"
                                      min="1"
                                      step="1"
                                      value={item.qty}
                                      onChange={(e) =>
                                        handleUpdateItemQtyInOrder(idx, e.target.value, false)
                                      }
                                      className="w-20 px-2.5 py-2 border border-slate-300 rounded-xl bg-white font-black text-slate-900 text-right"
                                    />
                                    <span className="font-bold text-slate-600">und</span>
                                  </div>
                                )}

                                <div className="w-20 text-right">
                                  <span className="font-black text-emerald-700 text-sm">
                                    {formatUsd(item.qty * item.unitPrice)}
                                  </span>
                                </div>

                                <button
                                  type="button"
                                  onClick={() => handleRemoveItemFromOrder(idx)}
                                  className="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 cursor-pointer"
                                  title="Quitar producto de la factura"
                                >
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-900 text-white flex items-center justify-between">
                        <div>
                          <span className="text-[11px] text-slate-400 block">
                            Delivery: {formatUsd(editingOrder.deliveryUsd)}
                          </span>
                          <span className="text-xs font-bold text-slate-300">
                            NUEVO TOTAL EXACTO:
                          </span>
                        </div>
                        <div className="text-right">
                          <span className="text-2xl font-black text-emerald-400 block">
                            {formatUsd(editingOrder.totalUsd)}
                          </span>
                          <span className="text-sm font-extrabold text-amber-300">
                            {formatBs(editingOrder.totalBs)}
                          </span>
                        </div>
                      </div>

                      <div className="flex flex-wrap justify-end gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setEditingOrder(null)}
                          className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold cursor-pointer"
                        >
                          Cancelar
                        </button>
                        <button
                          type="button"
                          onClick={handleSaveEditedOrder}
                          className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-md cursor-pointer"
                        >
                          💾 Guardar Cambios y Recalcular
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // ============================================================================
        // CAJA FÍSICA (POS) CON SOPORTE DE PESO (Kg/g) Y LITROS (Lt/mL)
        // ============================================================================
        function PosCashRegisterTab({
          settings,
          products,
          customers,
          sales,
          cashMovements,
          updateCloud,
          showToast,
        }) {
          const [showQuickClientModal, setShowQuickClientModal] = useState(false);
          const [quickFirstName, setQuickFirstName] = useState('');
          const [quickLastName, setQuickLastName] = useState('');
          const [quickCi, setQuickCi] = useState('');
          const [quickPhone, setQuickPhone] = useState('');

          const handleSaveQuickClient = (e) => {
            e.preventDefault();
            if (!quickFirstName.trim() || !quickLastName.trim() || !quickCi.trim()) {
              showToast('Nombre, Apellido y Cédula son obligatorios', 'warning');
              return;
            }
            const cleanCi = quickCi.trim().toUpperCase();
            const formattedCi = /^[VEJ]-/.test(cleanCi) ? cleanCi : `V-${cleanCi.replace(/\D/g, '')}`;
            const exists = customers.some((c) => c.ci === formattedCi);
            if (exists) {
              setSelectedCi(formattedCi);
              setShowQuickClientModal(false);
              showToast('Cliente ya existía, seleccionado en caja');
              return;
            }
            const newCust = {
              ci: formattedCi,
              firstName: quickFirstName.trim(),
              lastName: quickLastName.trim(),
              phone: quickPhone.trim() || 'N/A',
              address: 'Tienda Física',
              photo: null,
              createdAt: new Date().toISOString(),
            };
            updateCloud({ customers: [newCust, ...customers] });
            setSelectedCi(formattedCi);
            setQuickFirstName('');
            setQuickLastName('');
            setQuickCi('');
            setQuickPhone('');
            setShowQuickClientModal(false);
            showToast(`✅ Cliente ${newCust.firstName} ${newCust.lastName} (${formattedCi}) registrado`);
          };
          const [posSearch, setPosSearch] = useState('');
          const [posCart, setPosCart] = useState([]);
          const [selectedCi, setSelectedCi] = useState('GENERAL');
          const [paymentMethod, setPaymentMethod] = useState('Efectivo Dólares ($)');
          const [posMeasureProduct, setPosMeasureProduct] = useState(null);

          const filteredPosProducts = useMemo(() => {
            return products.filter((p) =>
              p.name.toLowerCase().includes(posSearch.toLowerCase())
            );
          }, [products, posSearch]);

          const enrichedPosCart = useMemo(() => {
            return posCart
              .map((item) => {
                const product = products.find((p) => p.id === item.productId);
                if (!product) return null;
                const saleMode = getProductSaleMode(product);
                const isWholesale = item.qty >= product.wholesaleMinQty;
                const unitPrice = isWholesale ? product.wholesalePrice : product.retailPrice;
                return {
                  ...item,
                  product,
                  saleMode,
                  isWholesale,
                  unitPrice,
                  lineTotal: round3(unitPrice * item.qty),
                };
              })
              .filter(Boolean);
          }, [posCart, products]);

          const posTotalUsd = enrichedPosCart.reduce((acc, i) => acc + i.lineTotal, 0);
          const posTotalBs = posTotalUsd * settings.exchangeRate;

          const handlePosProductClick = (product) => {
            if (product.stock <= 0) return;
            const mode = getProductSaleMode(product);
            if (mode === 'WEIGHT' || mode === 'VOLUME') {
              setPosMeasureProduct(product);
            } else {
              addPosItem(product.id, 1);
            }
          };

          const addPosItem = (productId, delta = 1) => {
            const product = products.find((p) => p.id === productId);
            if (!product || product.stock <= 0) return;

            setPosCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              const nextQty = round3((existing ? existing.qty : 0) + delta);
              if (nextQty <= 0) return prev.filter((i) => i.productId !== productId);
              if (nextQty > product.stock) {
                showToast(`Stock máximo disponible: ${product.stock}`, 'warning');
                return prev;
              }
              if (existing) {
                return prev.map((i) => (i.productId === productId ? { ...i, qty: nextQty } : i));
              }
              return [...prev, { productId, qty: nextQty }];
            });
          };

          const setPosItemQtyDirect = (productId, qty) => {
            const product = products.find((p) => p.id === productId);
            if (!product) return;
            const clean = round3(qty);
            if (clean <= 0) {
              setPosCart((prev) => prev.filter((i) => i.productId !== productId));
              return;
            }
            const clamped = Math.min(clean, product.stock);
            setPosCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              if (existing) {
                return prev.map((i) => (i.productId === productId ? { ...i, qty: clamped } : i));
              }
              return [...prev, { productId, qty: clamped }];
            });
          };

          const handleCompletePosSale = () => {
            if (enrichedPosCart.length === 0) return;

            const customerObj =
              selectedCi === 'GENERAL'
                ? null
                : customers.find((c) => c.ci === selectedCi) || null;

            const totalCostUsd = enrichedPosCart.reduce(
              (acc, i) => acc + i.product.costPrice * i.qty,
              0
            );

            const newSale = {
              id: `POS-${Math.floor(1000 + Math.random() * 9000)}`,
              date: new Date().toISOString(),
              channel: 'POS',
              status: 'COMPLETED',
              customerCi: customerObj ? customerObj.ci : 'CLIENTE-GENERAL',
              customerName: customerObj
                ? `${customerObj.firstName} ${customerObj.lastName}`
                : 'Cliente General (Mostrador)',
              customerPhone: customerObj?.phone || 'N/A',
              customerAddress: 'Tienda Física',
              paymentMethod,
              items: enrichedPosCart.map((i) => ({
                productId: i.product.id,
                name: i.product.name,
                qty: i.qty,
                saleMode: i.saleMode,
                unitPrice: i.unitPrice,
                costPrice: i.product.costPrice,
                isWholesale: i.isWholesale,
              })),
              subtotalUsd: posTotalUsd,
              deliveryUsd: 0,
              totalUsd: posTotalUsd,
              totalCostUsd,
              exchangeRate: settings.exchangeRate,
              totalBs: posTotalBs,
            };

            const updatedProducts = products.map((p) => {
              const sold = enrichedPosCart.find((i) => i.productId === p.id);
              return sold ? { ...p, stock: Math.max(0, round3(p.stock - sold.qty)) } : p;
            });

            const updatedSales = [newSale, ...sales];
            const updatedMovements = [
              {
                id: `MOV-${Date.now()}`,
                date: new Date().toISOString(),
                type: 'IN',
                category: `Venta Caja Física (${paymentMethod})`,
                description: `Ticket ${newSale.id} - ${newSale.customerName}`,
                amountUsd: posTotalUsd,
                currencyUsed: paymentMethod.includes('Bs') ? 'BS' : 'USD',
              },
              ...cashMovements,
            ];

            updateCloud({
              products: updatedProducts,
              sales: updatedSales,
              cashMovements: updatedMovements,
            });

            setPosCart([]);
            showToast(`Venta ${newSale.id} cobrada (${formatUsd(posTotalUsd)}) e inventario descontado`);
          };

          return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 bg-white rounded-3xl border border-slate-200 p-5 space-y-4 shadow-xs">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900">Punto de Venta (Mostrador)</h2>
                    <p className="text-xs text-slate-500">
                      Toca productos por unidad, o pesa en balanza (Kg/g) y mide líquidos (Lt/mL)
                    </p>
                  </div>
                  <div className="relative sm:w-64">
                    <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                    <input
                      type="text"
                      value={posSearch}
                      onChange={(e) => setPosSearch(e.target.value)}
                      placeholder="Buscar producto..."
                      className="w-full pl-9 pr-3 py-2 bg-slate-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[540px] overflow-y-auto pr-1">
                  {filteredPosProducts.map((p) => {
                    const mode = getProductSaleMode(p);
                    return (
                      <button
                        key={p.id}
                        onClick={() => handlePosProductClick(p)}
                        disabled={p.stock <= 0}
                        className="p-3 rounded-2xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/40 disabled:opacity-40 text-left flex items-center gap-3 transition cursor-pointer"
                      >
                        {p.image ? (
                          <img
                            src={p.image}
                            alt={p.name}
                            className="w-11 h-11 rounded-xl object-cover border border-slate-200 shrink-0"
                          />
                        ) : (
                          <span className="text-3xl w-11 text-center shrink-0">{p.emoji}</span>
                        )}
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-1.5">
                            <p className="font-bold text-slate-800 text-sm truncate">{p.name}</p>
                          </div>
                          <div className="flex items-center justify-between mt-1">
                            <span className="text-xs font-extrabold text-emerald-700">
                              {formatUsd(p.retailPrice)} {formatBasePriceLabel(mode)}
                            </span>
                            <span className="text-[11px] font-semibold text-slate-500">
                              Stock: {formatMeasureQty(p.stock, mode)}
                            </span>
                          </div>
                          {mode !== 'UNIT' && (
                            <span className="inline-flex items-center gap-1 mt-1 text-[10px] font-extrabold text-amber-800 bg-amber-100 px-2 py-0.5 rounded">
                              {mode === 'WEIGHT' ? <Scale className="w-3 h-3" /> : <Droplets className="w-3 h-3" />}
                              {mode === 'WEIGHT' ? 'Balanza Kg/g' : 'Medida Lt/mL'}
                            </span>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="lg:col-span-5 bg-white rounded-3xl border border-slate-200 p-5 flex flex-col justify-between shadow-xs space-y-4">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 className="font-extrabold text-slate-900 flex items-center gap-2">
                      <Receipt className="w-5 h-5 text-emerald-600" />
                      Ticket de Venta Actual
                    </h3>
                    {posCart.length > 0 && (
                      <button
                        onClick={() => setPosCart([])}
                        className="text-xs text-red-600 font-bold hover:underline cursor-pointer"
                      >
                        Limpiar
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-[11px] font-bold text-slate-600">
                          Cliente (Asociar CI)
                        </label>
                        <button
                          type="button"
                          onClick={() => setShowQuickClientModal(true)}
                          className="text-[10px] font-extrabold text-emerald-700 hover:underline cursor-pointer"
                        >
                          + Nuevo Cliente
                        </button>
                      </div>
                      <select
                        value={selectedCi}
                        onChange={(e) => setSelectedCi(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      >
                        <option value="GENERAL">Cliente General (Mostrador)</option>
                        {customers.map((c) => (

                            {showQuickClientModal && (

        // ============================================================================
        // GESTIÓN DE INVENTARIO: DESCRIPCIÓN, ELIMINAR PRODUCTO Y MODO DE VENTA (UND/KG/LT)
        // ============================================================================
        function InventoryManagementTab({
          settings,
          departments,
          setDepartments,
          products,
          setProducts,
          updateCloud,
          showToast,
        }) {
          const [editingProduct, setEditingProduct] = useState(null);
          const [invSearch, setInvSearch] = useState('');
          const [newDeptName, setNewDeptName] = useState('');
          const [newDeptEmoji, setNewDeptEmoji] = useState('📦');
          const productPhotoRef = useRef(null);

          const filteredInv = products.filter((p) =>
            p.name.toLowerCase().includes(invSearch.toLowerCase())
          );

          const handleAddDepartment = (e) => {
            e.preventDefault();
            const trimmed = newDeptName.trim();
            if (!trimmed) return;
            if (departments.some((d) => d.name.toLowerCase() === trimmed.toLowerCase())) {
              showToast('Ese departamento ya existe', 'warning');
              return;
            }
            const updatedDepts = [
              ...departments,
              { id: `dept-${Date.now()}`, name: trimmed, emoji: newDeptEmoji || '📦' },
            ];
            setDepartments(updatedDepts);
            setNewDeptName('');
            setNewDeptEmoji('📦');
            showToast(`Departamento "${trimmed}" agregado`);
          };

          const handleDeleteDepartment = (dept) => {
            if (departments.length <= 1) {
              showToast('Debe existir al menos un departamento activo', 'warning');
              return;
            }
            const fallbackDept = departments.find((d) => d.id !== dept.id)?.name || 'General';
            const updatedProducts = products.map((p) =>
              p.department === dept.name ? { ...p, department: fallbackDept } : p
            );
            const updatedDepts = departments.filter((d) => d.id !== dept.id);
            updateCloud({ products: updatedProducts, departments: updatedDepts });
            showToast(`Departamento "${dept.name}" eliminado`);
          };

          const openNewProductModal = () => {
            setEditingProduct({
              id: `prod-${Date.now()}`,
              name: '',
              description: '',
              department: departments[0]?.name || 'Víveres',
              emoji: '📦',
              image: null,
              costPrice: 1.0,
              retailPrice: 1.4,
              wholesalePrice: 1.2,
              wholesaleMinQty: 5,
              stock: 20,
              isOffer: false,
              saleMode: 'UNIT',
              unit: 'Unidad',
              isNew: true,
            });
          };

          const handleProductImageUpload = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              const compressed = await compressImageFile(file, 520, 0.82);
              setEditingProduct((prev) => ({ ...prev, image: compressed }));
              showToast('Foto JPG del producto cargada');
            } catch (err) {
              showToast('Error al procesar la imagen del producto', 'error');
            }
          };

          const handleSaveProduct = (e) => {
            e.preventDefault();
            if (!editingProduct.name.trim()) return;

            const mode = editingProduct.saleMode || 'UNIT';
            const defaultUnit =
              mode === 'WEIGHT'
                ? 'Kilogramo (Kg)'
                : mode === 'VOLUME'
                ? 'Litro (Lt)'
                : editingProduct.unit || 'Unidad';

            const cleanProduct = {
              id: editingProduct.id,
              name: editingProduct.name.trim(),
              description: (editingProduct.description || '').trim(),
              department: editingProduct.department,
              emoji: editingProduct.emoji || '📦',
              image: editingProduct.image || null,
              costPrice: Number(editingProduct.costPrice),
              retailPrice: Number(editingProduct.retailPrice),
              wholesalePrice: Number(editingProduct.wholesalePrice),
              wholesaleMinQty: Math.max(1, Number(editingProduct.wholesaleMinQty)),
              stock: Math.max(0, round3(Number(editingProduct.stock))),
              isOffer: Boolean(editingProduct.isOffer),
              saleMode: mode,
              unit: defaultUnit,
            };

            const exists = products.some((p) => p.id === cleanProduct.id);
            const updatedProducts = exists
              ? products.map((p) => (p.id === cleanProduct.id ? cleanProduct : p))
              : [cleanProduct, ...products];

            setProducts(updatedProducts);
            setEditingProduct(null);
            showToast('Producto guardado y sincronizado en la nube');
          };

          const handleDeleteProduct = (product) => {
            const updatedProducts = products.filter((p) => p.id !== product.id);
            setProducts(updatedProducts);
            if (editingProduct?.id === product.id) {
              setEditingProduct(null);
            }
            showToast(`🗑️ Producto "${product.name}" eliminado del catálogo`, 'info');
          };

          const toggleOfferQuick = (id) => {
            const updatedProducts = products.map((p) => (p.id === id ? { ...p, isOffer: !p.isOffer } : p));
            setProducts(updatedProducts);
          };

          return (
            <div className="space-y-6">
              <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-xs space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">

                    <h3 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                      <FolderPlus className="w-5 h-5 text-emerald-600" />
                      Departamentos y Rubros de la Tienda
                    </h3>
                    <p className="text-xs text-slate-500">
                      Agrega o quita departamentos fácilmente si trabajas con otros rubros
                    </p>
                  </div>
                </div>

                <form onSubmit={handleAddDepartment} className="flex flex-wrap items-center gap-2">
                  <input
                    type="text"
                    maxLength={4}
                    value={newDeptEmoji}
                    onChange={(e) => setNewDeptEmoji(e.target.value)}

                    className="w-14 px-2 py-2 border border-slate-300 rounded-xl text-center text-base"
                    title="Ícono o Emoji"
                  />
                  <input
                    type="text"
                    value={newDeptName}
                    onChange={(e) => setNewDeptName(e.target.value)}
                    placeholder="Nombre del nuevo departamento (Ej: Charcutería, Líquidos...)"
                    className="flex-1 min-w-[220px] px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 cursor-pointer"
                  >
                    <Plus className="w-4 h-4" />
                    Agregar Departamento
                  </button>
                </form>

                <div className="flex flex-wrap gap-2">
                  {departments.map((dept) => (
                    <span
                      key={dept.id}
                      className="inline-flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-800"
                    >
                      <span>{dept.emoji}</span>
                      <span>{dept.name}</span>
                      <button
                        type="button"
                        onClick={() => handleDeleteDepartment(dept)}
                        className="text-slate-400 hover:text-red-600 transition cursor-pointer"
                        title={`Eliminar ${dept.name}`}
                      >
                        ✕
                      </button>
                    </span>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-3xl border border-slate-200 p-5 shadow-xs space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-extrabold text-slate-900">
                      Gestión de Inventario, Peso (Kg), Litros (Lt) y Descripciones
                    </h2>
                    <p className="text-xs text-slate-500">
                      Configura productos por Unidad, por Peso (Kg/g) o por Litro (Lt/mL), añade descripciones o elimina artículos
                    </p>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="relative">
                      <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={invSearch}
                        onChange={(e) => setInvSearch(e.target.value)}
                        placeholder="Filtrar inventario..."

                      />
                    </div>
                    <button
                      onClick={openNewProductModal}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 shadow-sm cursor-pointer shrink-0"
                    >
                      <Plus className="w-4 h-4" />
                      Nuevo Producto

                  </div>
                </div>

                <div className="overflow-x-auto">

                      <tr className="border-b border-slate-200 text-[11px] font-extrabold uppercase text-slate-500 bg-slate-50">

                        <th className="py-3 px-3">Venta Mayor</th>
                        <th className="py-3 px-3">Stock</th>
                        <th className="py-3 px-3">Oferta</th>
                        <th className="py-3 px-3 text-right rounded-tr-xl">Acciones</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-xs">
                      {filteredInv.map((p) => {
                        const mode = getProductSaleMode(p);
                        return (
                          <tr key={p.id} className="hover:bg-slate-50/80 transition">
                            <td className="py-3 px-3">
                              <div className="flex items-center gap-2.5">
                                {p.image ? (
                                  <img
                                    src={p.image}
                                    alt={p.name}
                                    className="w-10 h-10 rounded-xl object-cover border border-slate-200 shrink-0"

                                  <span className="text-2xl w-10 text-center shrink-0">{p.emoji}</span>
                                )}
                                <div className="max-w-xs">
                                  <p className="font-bold text-slate-900">{p.name}</p>
                                  <span className="text-[11px] text-slate-400 block">{p.department}</span>

                                    <span className="text-[10px] text-slate-500 line-clamp-1">
                                      {p.description}

                            </td>
                            <td className="py-3 px-3">
                              {mode === 'WEIGHT' ? (

                                    ? 'bg-amber-100 text-amber-800'
                                    : 'bg-emerald-100 text-emerald-800'

                              >
                                {formatMeasureQty(p.stock, mode)}
                              </span>

                            <td className="py-3 px-3">
                              <button
                                onClick={() => toggleOfferQuick(p.id)}
                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition cursor-pointer ${
                                  p.isOffer
                                    ? 'bg-amber-500 text-white'
                                    : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                                }`}
                              >
                                {p.isOffer ? 'Activa' : 'Normal'}
                              </button>

                            <td className="py-3 px-3 text-right">
                              <div className="inline-flex items-center gap-1.5">
                                <button
                                  onClick={() =>
                                    setEditingProduct({
                                      ...p,
                                      saleMode: getProductSaleMode(p),
                                      description: p.description || '',
                                    })
                                  }
                                  className="p-2 rounded-xl bg-slate-100 hover:bg-emerald-100 text-slate-700 hover:text-emerald-700 transition cursor-pointer"
                                  title="Editar Producto"
                                >

                                </button>

                                  onClick={() => handleDeleteProduct(p)}
                                  className="p-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 transition cursor-pointer"
                                  title="Eliminar Producto"
                                >
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

              {editingProduct && (
