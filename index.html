                </div>

                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
                  <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                    <Megaphone className="w-4 h-4 text-emerald-600" />
                    2. Textos de Portada, Banner y Diseño Móvil
                  </h3>

                  <div className="bg-white p-3.5 rounded-xl border border-slate-200 space-y-2.5">
                    <label className="flex items-center gap-2 text-xs font-extrabold text-slate-800 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={Boolean(form.topBannerActive)}
                        onChange={(e) => setForm({ ...form, topBannerActive: e.target.checked })}
                        className="w-4 h-4 accent-emerald-600"
                      />
                      Activar cintillo de anuncios arriba de la página
                    </label>
                    {form.topBannerActive && (
                      <input
                        type="text"
                        value={form.topBannerText || ''}
                        onChange={(e) => setForm({ ...form, topBannerText: e.target.value })}
                        placeholder="Ej: 🚀 ¡Delivery GRATIS hoy por compras mayores a $10!"
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                      />
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">
                        Etiqueta del Banner Principal
                      </label>
                      <input
                        type="text"
                        value={form.heroBadgeText || ''}
                        onChange={(e) => setForm({ ...form, heroBadgeText: e.target.value })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-xs font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                        <LayoutGrid className="w-3.5 h-3.5 text-slate-500" />
                        Productos por fila en Celular
                      </label>
                      <select
                        value={form.mobileColumns || 2}
                        onChange={(e) => setForm({ ...form, mobileColumns: Number(e.target.value) })}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-xs font-bold"
                      >
                        <option value={2}>2 productos por fila (Catálogo compacto)</option>
                        <option value={1}>1 producto por fila (Tarjetas grandes)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Título Principal de Bienvenida
                    </label>
                    <input
                      type="text"
                      value={form.heroTitle || ''}
                      onChange={(e) => setForm({ ...form, heroTitle: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-xs font-bold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Descripción / Mensaje de Delivery del Banner
                    </label>
                    <textarea
                      rows={2}
                      value={form.heroSubtitle || ''}
                      onChange={(e) => setForm({ ...form, heroSubtitle: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white text-xs"
                    />
                  </div>
                </div>

                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                      <Palette className="w-4 h-4 text-emerald-600" />
                      3. Paleta de Colores de la Interfaz
                    </h3>
                    <div className="flex flex-wrap gap-1.5">
                      {COLOR_PRESETS.map((preset) => (
                        <button
                          key={preset.name}
                          type="button"
                          onClick={() =>
                            setForm({
                              ...form,
                              primaryColor: preset.primary,
                              accentColor: preset.accent,
                              headerColor: preset.header,
                              pageBgColor: preset.bg,
                            })
                          }
                          className="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:border-slate-400 text-[11px] font-bold flex items-center gap-1.5 cursor-pointer"
                        >
                          <span
                            className="w-3 h-3 rounded-full"
                            style={{ backgroundColor: preset.primary }}
                          />
                          {preset.name}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-slate-800">Primario</p>
                        <p className="text-[10px] text-slate-400">Botones</p>
                      </div>
                      <input
                        type="color"
                        value={form.primaryColor || '#059669'}
                        onChange={(e) => setForm({ ...form, primaryColor: e.target.value })}
                        className="w-9 h-9 rounded-lg cursor-pointer border-0"
                      />
                    </div>

                    <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-slate-800">Acento</p>
                        <p className="text-[10px] text-slate-400">Ofertas</p>
                      </div>
                      <input
                        type="color"
                        value={form.accentColor || '#f59e0b'}
                        onChange={(e) => setForm({ ...form, accentColor: e.target.value })}
                        className="w-9 h-9 rounded-lg cursor-pointer border-0"
                      />
                    </div>

                    <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-slate-800">Encabezado</p>
                        <p className="text-[10px] text-slate-400">Barra top</p>
                      </div>
                      <input
                        type="color"
                        value={form.headerColor || '#064e3b'}
                        onChange={(e) => setForm({ ...form, headerColor: e.target.value })}
                        className="w-9 h-9 rounded-lg cursor-pointer border-0"
                      />
                    </div>

                    <div className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                      <div>
                        <p className="text-xs font-bold text-slate-800">Fondo</p>
                        <p className="text-[10px] text-slate-400">Página</p>
                      </div>
                      <input
                        type="color"
                        value={form.pageBgColor || '#f8fafc'}
                        onChange={(e) => setForm({ ...form, pageBgColor: e.target.value })}
                        className="w-9 h-9 rounded-lg cursor-pointer border-0"
                      />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-emerald-700 mb-1">
                      Tasa de Cambio del Día (Bs. por $1)
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      min="1"
                      required
                      value={form.exchangeRate}
                      onChange={(e) => setForm({ ...form, exchangeRate: e.target.value })}
                      className="w-full px-3.5 py-2.5 border-2 border-emerald-500 rounded-xl font-black text-emerald-800 text-base"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      WhatsApp Pedidos y Atención (Ej: 58412...)
                    </label>
                    <input
                      type="text"
                      required
                      value={form.whatsappNumber}
                      onChange={(e) => setForm({ ...form, whatsappNumber: e.target.value })}
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl font-semibold"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Delivery Gratis desde ($)
                    </label>
                    <input
                      type="number"
                      step="0.5"
                      min="0"
                      required
                      value={form.freeDeliveryThreshold}
                      onChange={(e) =>
                        setForm({ ...form, freeDeliveryThreshold: e.target.value })
                      }
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl font-semibold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      Costo Delivery (&lt; ${form.freeDeliveryThreshold})
                    </label>
                    <input
                      type="number"
                      step="0.1"
                      min="0"
                      required
                      value={form.deliveryFee}
                      onChange={(e) => setForm({ ...form, deliveryFee: e.target.value })}
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl font-semibold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      PIN / Contraseña Admin (6-32 car.)
                    </label>
                    <div className="relative">
                      <input
                        type={showAdminPin ? 'text' : 'password'}
                        minLength={6}
                        maxLength={32}
                        required
                        value={form.adminPin}
                        onChange={(e) => setForm({ ...form, adminPin: e.target.value })}
                        className="w-full pl-3.5 pr-10 py-2.5 border border-slate-300 rounded-xl font-bold"
                      />
                      <button
                        type="button"
                        onClick={() => setShowAdminPin(!showAdminPin)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 cursor-pointer"
                      >
                        {showAdminPin ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                      </button>
                    </div>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    type="submit"
                    style={{ backgroundColor: form.primaryColor || '#059669' }}
                    className="w-full sm:w-auto px-8 py-3.5 hover:opacity-95 text-white font-extrabold rounded-xl shadow-md transition cursor-pointer"
                  >
                    💾 Guardar Diseño, Colores y Configuración
                  </button>
                </div>
              </form>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
