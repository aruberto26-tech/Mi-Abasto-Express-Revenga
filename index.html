        // ============================================================================
        // MÓDULO DE CUENTAS POR PAGAR A PROVEEDORES (PENDIENTES VS FINALIZADAS)
        // ============================================================================
        function SuppliersPayablesTab({
          suppliers,
          setSuppliers,
          payables,
          setPayables,
          cashMovements,
          setCashMovements,
          showToast,
        }) {
          const [supName, setSupName] = useState('');
          const [supRif, setSupRif] = useState('');
          const [supPhone, setSupPhone] = useState('');
          const [supPaymentMethods, setSupPaymentMethods] = useState('');
          const [supCat, setSupCat] = useState('Víveres y Secos');

          const [selectedSupId, setSelectedSupId] = useState(suppliers[0]?.id || '');
          const [invoiceNum, setInvoiceNum] = useState('');
          const [dueDate, setDueDate] = useState('');
          const [totalUsd, setTotalUsd] = useState('');
          const [notes, setNotes] = useState('');
          const [abonoAmounts, setAbonoAmounts] = useState({});
          const [invoiceTab, setInvoiceTab] = useState('PENDING');

          const pendingInvoices = useMemo(
            () => payables.filter((p) => p.status !== 'PAID' && round3(p.totalUsd - p.paidUsd) > 0),
            [payables]
          );

          const finalizedInvoices = useMemo(
            () => payables.filter((p) => p.status === 'PAID' || round3(p.totalUsd - p.paidUsd) <= 0),
            [payables]
          );

          const summary = useMemo(() => {
            let totalDebt = 0;
            let overdueCount = 0;
            pendingInvoices.forEach((p) => {
              const bal = Math.max(0, round3(p.totalUsd - p.paidUsd));
              totalDebt += bal;
              if (bal > 0 && new Date(p.dueDate) < new Date()) overdueCount++;
            });
            return { totalDebt, overdueCount };
          }, [pendingInvoices]);

          const handleCreateSupplier = (e) => {
            e.preventDefault();
            if (!supName.trim()) return;
            const newSup = {
              id: `prov-${Date.now()}`,
              name: supName.trim(),
              rif: supRif.trim() || 'S/R',
              phone: supPhone.trim() || 'S/T',
              paymentMethods: supPaymentMethods.trim() || 'Efectivo / Transferencia',
              category: supCat,
            };
            const updated = [...suppliers, newSup];
            setSuppliers(updated);
            if (!selectedSupId) setSelectedSupId(newSup.id);
            setSupName('');
            setSupRif('');
            setSupPhone('');
            setSupPaymentMethods('');
            showToast('Proveedor y métodos de pago registrados');
          };

          const handleDeleteSupplier = (sup) => {
            setSuppliers(suppliers.filter((s) => s.id !== sup.id));
            if (selectedSupId === sup.id) {
              const remaining = suppliers.filter((s) => s.id !== sup.id);
              setSelectedSupId(remaining[0]?.id || '');
            }
            showToast(`🗑️ Proveedor "${sup.name}" eliminado`, 'info');
          };

          const handleCreatePayable = (e) => {
            e.preventDefault();
            const sup = suppliers.find((s) => s.id === selectedSupId);
            const amt = Number(totalUsd);
            if (!sup || !amt || amt <= 0 || !dueDate) {
              showToast('Completa proveedor, monto y fecha de vencimiento', 'warning');
              return;
            }
            const newItem = {
              id: `CXP-${Math.floor(100 + Math.random() * 900)}`,
              supplierId: sup.id,
              supplierName: sup.name,
              invoiceNumber: invoiceNum.trim() || `FAC-${Date.now().toString().slice(-4)}`,
              issueDate: new Date().toISOString().slice(0, 10),
              dueDate,
              totalUsd: amt,
              paidUsd: 0,
              installments: [],
              notes: notes.trim(),
              status: 'PENDING',
            };
            setPayables([newItem, ...payables]);
            setInvoiceNum('');
            setTotalUsd('');
            setNotes('');
            setInvoiceTab('PENDING');
            showToast('Factura por pagar registrada en Pendientes');
          };

          const handlePayInstallment = (payable, customAmount = null) => {
            const balance = Math.max(0, round3(payable.totalUsd - payable.paidUsd));
            const parsedCustom = customAmount !== null ? Number(String(customAmount).replace(',', '.')) : null;
            if (customAmount !== null && (!parsedCustom || parsedCustom <= 0)) {
              showToast('Escribe un monto de abono válido mayor a 0', 'warning');
              return;
            }
            const payNow = parsedCustom !== null ? Math.min(balance, round3(parsedCustom)) : balance;
            if (!payNow || payNow <= 0) return;

            const nextPaid = round3(payable.paidUsd + payNow);
            const isFull = nextPaid >= payable.totalUsd;
            const remainingAfter = Math.max(0, round3(payable.totalUsd - (isFull ? payable.totalUsd : nextPaid)));

            const newInstallment = {
              date: new Date().toISOString(),
              amountUsd: payNow,
              remainingUsd: remainingAfter,
              type: isFull ? 'Liquidación Total' : 'Abono Parcial',
            };

            setPayables(
              payables.map((p) =>
                p.id === payable.id
                  ? {
                      ...p,
                      paidUsd: isFull ? p.totalUsd : nextPaid,
                      status: isFull ? 'PAID' : 'PARTIAL',
                      paidAt: isFull ? new Date().toISOString() : p.paidAt || null,
                      installments: [...(p.installments || []), newInstallment],
                    }
                  : p
              )
            );

            setCashMovements([
              {
                id: `MOV-${Date.now()}`,
                date: new Date().toISOString(),
                type: 'OUT',
                category: 'Pago a Proveedores',
                description: `${isFull ? 'Liquidación total' : 'Abono'} ${payable.invoiceNumber} - ${payable.supplierName}`,
                amountUsd: payNow,
                currencyUsed: 'USD',
              },
              ...cashMovements,
            ]);

            setAbonoAmounts((prev) => ({ ...prev, [payable.id]: '' }));
            if (isFull) {
              showToast(`✅ Factura ${payable.invoiceNumber} liquidada y pasada a Finalizadas`);
            } else {
              showToast(`Abono de ${formatUsd(payNow)} restado. Resta: ${formatUsd(remainingAfter)}`);
            }
          };

          const getSemaphore = (dueStr, bal, paidUsd = 0) => {
            if (bal <= 0) return { text: '✅ LISTO / PAGADA', cls: 'bg-emerald-600 text-white' };
            const diffDays = Math.ceil((new Date(dueStr) - new Date()) / (1000 * 60 * 60 * 24));
            const partialTag = paidUsd > 0 ? ` • ABONADO (FALTA ${formatUsd(bal)})` : '';
            if (diffDays < 0) return { text: `🔴 VENCIDA (${Math.abs(diffDays)}d)${partialTag}`, cls: 'bg-red-100 text-red-700' };
            if (diffDays <= 3) return { text: `🟡 VENCE EN ${diffDays}d${partialTag}`, cls: 'bg-amber-100 text-amber-800' };
            if (paidUsd > 0) return { text: `🟠 ABONADO • FALTA ${formatUsd(bal)}`, cls: 'bg-amber-100 text-amber-800' };
            return { text: `🟢 AL DÍA (${diffDays}d)`, cls: 'bg-emerald-50 text-emerald-700' };
          };

          const displayedInvoices = invoiceTab === 'PENDING' ? pendingInvoices : finalizedInvoices;

          return (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-5 rounded-3xl border border-slate-200">
                  <span className="text-xs font-bold text-slate-500">DEUDA PENDIENTE A PROVEEDORES</span>
                  <p className="text-2xl font-black text-red-600 mt-1">{formatUsd(summary.totalDebt)}</p>
                </div>
                <div className="bg-white p-5 rounded-3xl border border-slate-200">
                  <span className="text-xs font-bold text-slate-500">FACTURAS VENCIDAS (ALERTA ROJA)</span>
                  <p className="text-2xl font-black text-amber-600 mt-1">{summary.overdueCount}</p>
                </div>
                <div className="bg-slate-900 text-white p-5 rounded-3xl">
                  <span className="text-xs font-bold text-slate-400">FACTURAS FINALIZADAS</span>
                  <p className="text-2xl font-black text-emerald-400 mt-1">{finalizedInvoices.length}</p>
                </div>
              </div>

              {/* Directorio de Proveedores con Métodos de Pago y Opción de Eliminar */}
              <div className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                <h3 className="font-extrabold text-slate-900 text-sm">Directorio de Proveedores y Métodos de Pago</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  {suppliers.map((s) => (
                    <div key={s.id} className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex items-start justify-between gap-2 text-xs">
                      <div className="space-y-1">
                        <p className="font-extrabold text-slate-900 text-sm">{s.name}</p>
                        <p className="text-slate-500">RIF: {s.rif} • Tel: {s.phone}</p>
                        <p className="text-emerald-800 font-bold bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200">
                          💳 {s.paymentMethods || 'Sin método registrado'}
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() => handleDeleteSupplier(s)}
                        className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl cursor-pointer shrink-0"
                        title="Eliminar proveedor"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-4 space-y-5">
                  <form onSubmit={handleCreatePayable} className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                    <h3 className="font-extrabold text-slate-900 text-sm">Registrar Factura / Crédito de Proveedor</h3>
                    <select
                      value={selectedSupId}
                      onChange={(e) => setSelectedSupId(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold"
                    >
                      {suppliers.map((s) => (
                        <option key={s.id} value={s.id}>{s.name}</option>
                      ))}
                    </select>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="N° Factura" value={invoiceNum} onChange={(e) => setInvoiceNum(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                      <input type="number" step="0.01" placeholder="Monto ($)" value={totalUsd} onChange={(e) => setTotalUsd(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" required />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Fecha Límite de Pago</label>
                      <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                    </div>
                    <input type="text" placeholder="Detalle mercancía (ej: 5 bultos harina)" value={notes} onChange={(e) => setNotes(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                    <button type="submit" className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                      Guardar Cuenta por Pagar
                    </button>
                  </form>

                  <form onSubmit={handleCreateSupplier} className="bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                    <h3 className="font-extrabold text-slate-900 text-sm">Nuevo Proveedor y Métodos de Pago</h3>
                    <input type="text" placeholder="Nombre o Razón Social *" value={supName} onChange={(e) => setSupName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="RIF (J-...)" value={supRif} onChange={(e) => setSupRif(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                      <input type="text" placeholder="Teléfono" value={supPhone} onChange={(e) => setSupPhone(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                    </div>
                    <input
                      type="text"
                      placeholder="Métodos de Pago (Ej: Pago Móvil 0414..., Zelle, Cuenta Banco...)"
                      value={supPaymentMethods}
                      onChange={(e) => setSupPaymentMethods(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs"
                      required
                    />
                    <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                      + Agregar Proveedor
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <h3 className="font-extrabold text-slate-900">Facturas de Proveedores</h3>
                    <div className="flex gap-1.5 bg-slate-100 p-1 rounded-xl">
                      <button
                        type="button"
                        onClick={() => setInvoiceTab('PENDING')}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition cursor-pointer ${
                          invoiceTab === 'PENDING'
                            ? 'bg-amber-500 text-slate-950 shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        ⏳ Pendientes ({pendingInvoices.length})
                      </button>
                      <button
                        type="button"
                        onClick={() => setInvoiceTab('FINALIZED')}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition cursor-pointer ${
                          invoiceTab === 'FINALIZED'
                            ? 'bg-emerald-600 text-white shadow-xs'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        ✅ Finalizadas ({finalizedInvoices.length})
                      </button>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {displayedInvoices.length === 0 ? (
                      <div className="py-10 text-center text-xs text-slate-400 bg-slate-50 rounded-2xl border border-slate-200">
                        {invoiceTab === 'PENDING'
                          ? 'No tienes facturas pendientes por pagar.'
                          : 'Aún no hay facturas finalizadas en el historial.'}
                      </div>
                    ) : (
                      displayedInvoices.map((p) => {
                        const balance = Math.max(0, round3(p.totalUsd - p.paidUsd));
                        const sem = getSemaphore(p.dueDate, balance, p.paidUsd);
                        const supInfo = suppliers.find((s) => s.id === p.supplierId);
                        return (
                          <div
                            key={p.id}
                            className={`p-4 rounded-2xl border space-y-2.5 ${
                              invoiceTab === 'FINALIZED'
                                ? 'border-emerald-200 bg-emerald-50/40'
                                : 'border-slate-200 bg-slate-50/70'
                            }`}
                          >
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                              <div>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span className="font-extrabold text-slate-900 text-sm">{p.supplierName}</span>
                                  <span className="text-xs font-bold text-slate-500">({p.invoiceNumber})</span>
                                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${sem.cls}`}>{sem.text}</span>
                                </div>
                                {supInfo?.paymentMethods && (
                                  <p className="text-[11px] font-bold text-emerald-700 mt-0.5">
                                    💳 Pago: {supInfo.paymentMethods}
                                  </p>
                                )}
                                <p className="text-xs text-slate-500 mt-0.5">
                                  {invoiceTab === 'FINALIZED'
                                    ? `Liquidada el ${p.paidAt ? new Date(p.paidAt).toLocaleDateString('es-VE') : p.dueDate}`
                                    : `Emisión: ${p.issueDate} • Vence: ${p.dueDate}`}{' '}
                                  • {p.notes || 'Sin notas'}
                                </p>
                                <div className="flex flex-wrap gap-4 text-xs mt-1">
                                  <span>Total Factura: <strong>{formatUsd(p.totalUsd)}</strong></span>
                                  <span className="text-emerald-700">Abonado: <strong>{formatUsd(p.paidUsd)}</strong></span>
                                  <span className="text-red-600">Total Restante: <strong>{formatUsd(balance)}</strong></span>
                                </div>
                              </div>

                              {balance > 0 && (
                                <div className="flex items-center gap-2">
                                  <input
                                    type="number"
                                    step="0.01"
                                    placeholder="Abono $"
                                    value={abonoAmounts[p.id] || ''}
                                    onChange={(e) => setAbonoAmounts({ ...abonoAmounts, [p.id]: e.target.value })}
                                    className="w-24 px-2.5 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                                  />
                                  <button
                                    type="button"
                                    onClick={() => handlePayInstallment(p, abonoAmounts[p.id])}
                                    className="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-extrabold cursor-pointer"
                                  >
                                    Abonar
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handlePayInstallment(p, null)}
                                    className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold cursor-pointer"
                                  >
                                    Liquidar
                                  </button>
                                </div>
                              )}
                            </div>

                            {/* Historial detallado de abonos por fecha */}
                            {p.installments && p.installments.length > 0 && (
                              <div className="pt-2 border-t border-slate-200/80 space-y-1 text-[11px]">
                                <span className="font-extrabold text-slate-600 block">Historial de Abonos Realizados:</span>
                                {p.installments.map((inst, idx) => (
                                  <div key={idx} className="flex items-center justify-between bg-white px-2.5 py-1 rounded-lg border border-slate-200/60">
                                    <span>
                                      📅 {new Date(inst.date).toLocaleString('es-VE')} — <strong>{inst.type}</strong>
                                    </span>
                                    <span>
                                      Abono: <strong className="text-emerald-700">{formatUsd(inst.amountUsd)}</strong> | Restante: <strong className="text-red-600">{formatUsd(inst.remainingUsd)}</strong>
                                    </span>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ============================================================================
        // MÓDULO DE NÓMINA Y CONTROL DE PERSONAL (CON Y SIN ACCESO AL SISTEMA)
        // ============================================================================
        function PayrollStaffTab({
          employees,
          setEmployees,
          cashMovements,
          setCashMovements,
          showToast,
        }) {
          const [fullName, setFullName] = useState('');
          const [ci, setCi] = useState('');
          const [position, setPosition] = useState('');
          const [hasSystemAccess, setHasSystemAccess] = useState(false);
          const [payFrequency, setPayFrequency] = useState('WEEKLY');
          const [baseSalaryUsd, setBaseSalaryUsd] = useState('');
          const [advanceInputs, setAdvanceInputs] = useState({});

          const handleAddEmployee = (e) => {
            e.preventDefault();
            if (!fullName.trim() || !baseSalaryUsd) return;
            const newEmp = {
              id: `emp-${Date.now()}`,
              fullName: fullName.trim(),
              ci: ci.trim() || 'S/C',
              position: position.trim() || 'Operario / Tienda',
              hasSystemAccess,
              payFrequency,
              baseSalaryUsd: Number(baseSalaryUsd),
              advancesUsd: 0,
              paidCurrentPeriodUsd: 0,
              payrollStatus: 'PENDING',
              advanceNotes: '',
              active: true,
            };
            setEmployees([...employees, newEmp]);
            setFullName('');
            setCi('');
            setPosition('');
            setBaseSalaryUsd('');
            showToast('Trabajador agregado a la nómina');
          };

          const handleAddAdvance = (emp) => {
            const rawVal = String(advanceInputs[emp.id] || '').replace(',', '.');
            const amt = Number(rawVal);
            if (!amt || amt <= 0) {
              showToast('Ingresa un monto de abono o adelanto válido mayor a 0', 'warning');
              return;
            }
            const currentAdvances = Number(emp.advancesUsd || 0);
            const currentPaid = Number(emp.paidCurrentPeriodUsd || 0);
            const remainingBefore = Math.max(0, round3(emp.baseSalaryUsd - currentAdvances - currentPaid));
            if (remainingBefore <= 0) {
              showToast(`${emp.fullName} ya tiene su período listo / pagado completo`, 'info');
              return;
            }
            const appliedAmt = Math.min(remainingBefore, round3(amt));
            const nextAdvances = round3(currentAdvances + appliedAmt);
            const nextRemaining = Math.max(0, round3(emp.baseSalaryUsd - nextAdvances - currentPaid));
            const isReady = nextRemaining <= 0;

            setEmployees(
              employees.map((e) =>
                e.id === emp.id
                  ? {
                      ...e,
                      advancesUsd: nextAdvances,
                      payrollStatus: isReady ? 'PAID' : 'PARTIAL',
                      lastPaidAt: isReady ? new Date().toISOString() : e.lastPaidAt || null,
                    }
                  : e
              )
            );
            setAdvanceInputs({ ...advanceInputs, [emp.id]: '' });
            if (isReady) {
              showToast(`✅ Con este abono de ${formatUsd(appliedAmt)}, la nómina de ${emp.fullName} quedó LISTA (Pagada)`);
            } else {
              showToast(`Abono / adelanto de ${formatUsd(appliedAmt)} cargado a ${emp.fullName}. Faltante: ${formatUsd(nextRemaining)}`);
            }
          };

          const handleProcessPayroll = (emp) => {
            const currentAdvances = Number(emp.advancesUsd || 0);
            const currentPaid = Number(emp.paidCurrentPeriodUsd || 0);
            const netPay = Math.max(0, round3(emp.baseSalaryUsd - currentAdvances - currentPaid));

            if (netPay > 0) {
              setCashMovements([
                {
                  id: `MOV-${Date.now()}`,
                  date: new Date().toISOString(),
                  type: 'OUT',
                  category: 'Pago de Nómina',
                  description: `Liquidación Nómina ${emp.fullName} (${emp.position}) - Base: ${formatUsd(emp.baseSalaryUsd)} | Desc. Adelantos/Abonos: ${formatUsd(currentAdvances)}`,
                  amountUsd: netPay,
                  currencyUsed: 'USD',
                },
                ...cashMovements,
              ]);
            }

            setEmployees(
              employees.map((e) =>
                e.id === emp.id
                  ? {
                      ...e,
                      paidCurrentPeriodUsd: round3(currentPaid + netPay),
                      payrollStatus: 'PAID',
                      lastPaidAt: new Date().toISOString(),
                    }
                  : e
              )
            );
            showToast(`✅ Nómina de ${emp.fullName} marcada como LISTA / PAGADA (${formatUsd(netPay)} liquidado)`);
          };

          const handleResetNewPayrollPeriod = () => {
            setEmployees(
              employees.map((e) => ({
                ...e,
                advancesUsd: 0,
                paidCurrentPeriodUsd: 0,
                payrollStatus: 'PENDING',
                advanceNotes: '',
              }))
            );
            showToast('🔄 Nuevo período de nómina iniciado: todos los trabajadores están listos para el nuevo ciclo');
          };

          return (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <form onSubmit={handleAddEmployee} className="lg:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 space-y-3 h-fit">
                <h3 className="font-extrabold text-slate-900">Registrar Trabajador en Nómina</h3>
                <input type="text" placeholder="Nombre y Apellido *" value={fullName} onChange={(e) => setFullName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" placeholder="Cédula (V-...)" value={ci} onChange={(e) => setCi(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                  <input type="text" placeholder="Cargo (ej: Delivery)" value={position} onChange={(e) => setPosition(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <select value={payFrequency} onChange={(e) => setPayFrequency(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold">
                    <option value="WEEKLY">Pago Semanal</option>
                    <option value="BIWEEKLY">Pago Quincenal</option>
                    <option value="MONTHLY">Pago Mensual</option>
                  </select>
                  <input type="number" step="0.01" placeholder="Sueldo Base ($)" value={baseSalaryUsd} onChange={(e) => setBaseSalaryUsd(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" required />
                </div>
                <label className="flex items-center gap-2 text-xs font-bold text-slate-700 p-2 bg-slate-50 rounded-xl cursor-pointer">
                  <input type="checkbox" checked={hasSystemAccess} onChange={(e) => setHasSystemAccess(e.target.checked)} />
                  Tiene acceso al sistema POS / Admin
                </label>
                <button type="submit" className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                  + Agregar Empleado
                </button>
              </form>

              <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h3 className="font-extrabold text-slate-900">Nómina Activa, Adelantos y Liquidación</h3>
                  <button
                    type="button"
                    onClick={handleResetNewPayrollPeriod}
                    className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer"
                  >
                    🔄 Iniciar Nuevo Período de Nómina
                  </button>
                </div>
                <div className="space-y-3">
                  {employees.map((emp) => {
                    const advances = Number(emp.advancesUsd || 0);
                    const paid = Number(emp.paidCurrentPeriodUsd || 0);
                    const remainingToPay = Math.max(0, round3(emp.baseSalaryUsd - advances - paid));
                    const isPaidComplete = emp.payrollStatus === 'PAID' || remainingToPay <= 0;
                    const hasPartialAbono = !isPaidComplete && (advances > 0 || paid > 0);

                    return (
                      <div
                        key={emp.id}
                        className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                          isPaidComplete
                            ? 'border-emerald-300 bg-emerald-50/50'
                            : hasPartialAbono
                            ? 'border-amber-300 bg-amber-50/40'
                            : 'border-slate-200 bg-slate-50/70'
                        }`}
                      >
                        <div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-extrabold text-slate-900 text-sm">{emp.fullName}</span>
                            <span className="text-xs text-slate-500">({emp.position})</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${emp.hasSystemAccess ? 'bg-sky-100 text-sky-800' : 'bg-slate-200 text-slate-700'}`}>
                              {emp.hasSystemAccess ? 'Con Acceso POS' : 'Operativo sin Acceso'}
                            </span>
                            {isPaidComplete ? (
                              <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-600 text-white">
                                ✓ LISTO / PAGADO
                              </span>
                            ) : hasPartialAbono ? (
                              <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-amber-500 text-white">
                                ⏳ ABONADO (FALTA {formatUsd(remainingToPay)})
                              </span>
                            ) : (
                              <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-200 text-slate-700">
                                PENDIENTE
                              </span>
                            )}
                          </div>
                          <div className="flex flex-wrap gap-4 text-xs mt-1.5">
                            <span>Sueldo Base: <strong>{formatUsd(emp.baseSalaryUsd)}</strong></span>
                            <span className="text-amber-700">Abonos / Adelantos: <strong>-{formatUsd(advances)}</strong></span>
                            {paid > 0 && (
                              <span className="text-emerald-700">Liquidado: <strong>{formatUsd(paid)}</strong></span>
                            )}
                            <span className={isPaidComplete ? 'text-emerald-700 font-bold' : 'text-red-600 font-bold'}>
                              Faltante por Pagar: <strong>{formatUsd(remainingToPay)}</strong>
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center gap-2 flex-wrap">
                          {!isPaidComplete ? (
                            <>
                              <input
                                type="number"
                                step="0.01"
                                min="0.01"
                                placeholder="Abono $"
                                value={advanceInputs[emp.id] || ''}
                                onChange={(e) => setAdvanceInputs({ ...advanceInputs, [emp.id]: e.target.value })}
                                className="w-24 px-2.5 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-white"
                              />
                              <button
                                type="button"
                                onClick={() => handleAddAdvance(emp)}
                                className="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-extrabold cursor-pointer"
                              >
                                + Abono / Adelanto
                              </button>
                              <button
                                type="button"
                                onClick={() => handleProcessPayroll(emp)}
                                className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold cursor-pointer"
                              >
                                Pagar Todo ({formatUsd(remainingToPay)})
                              </button>
                            </>
                          ) : (
                            <button
                              type="button"
                              onClick={() => {
                                setEmployees(
                                  employees.map((e) =>
                                    e.id === emp.id
                                      ? { ...e, advancesUsd: 0, paidCurrentPeriodUsd: 0, payrollStatus: 'PENDING' }
                                      : e
                                  )
                                );
                                showToast(`Ciclo reiniciado para ${emp.fullName}`);
                              }}
                              className="px-3 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-xl text-xs font-bold cursor-pointer"
                            >
                              Nuevo Ciclo
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={() => {
                              setEmployees(employees.filter((e) => e.id !== emp.id));
                              showToast(`🗑️ Empleado ${emp.fullName} eliminado de la nómina`, 'info');
                            }}
                            className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition cursor-pointer"
                            title="Eliminar empleado de la nómina"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        // ============================================================================
        // MÓDULO DE ROLES DE USUARIO Y CUPONES PROMOCIONALES (SOLO DUEÑO)
        // ============================================================================
        function StaffRolesTab({ staffUsers, setStaffUsers, coupons = [], setCoupons, showToast }) {
          const [name, setName] = useState('');
          const [role, setRole] = useState('CASHIER');
          const [pin, setPin] = useState('');

          const [couponCode, setCouponCode] = useState('');
          const [couponPct, setCouponPct] = useState('10');
          const [couponMin, setCouponMin] = useState('5');

          const handleCreateStaff = (e) => {
            e.preventDefault();
            if (!name.trim() || pin.trim().length < 4) {
              showToast('Ingresa nombre y un PIN de al menos 4 caracteres', 'warning');
              return;
            }
            setStaffUsers([
              ...staffUsers,
              { id: `staff-${Date.now()}`, name: name.trim(), role, pin: pin.trim(), active: true },
            ]);
            setName('');
            setPin('');
            showToast('Usuario de sistema creado con su rol asignado');
          };

          const handleCreateCoupon = (e) => {
            e.preventDefault();
            if (!couponCode.trim() || !setCoupons) return;
            const cleanCode = couponCode.trim().toUpperCase();
            setCoupons([
              {
                code: cleanCode,
                discountPercent: Math.min(90, Math.max(1, Number(couponPct) || 5)),
                minOrderUsd: Math.max(0, Number(couponMin) || 0),
                active: true,
                description: `${couponPct}% de descuento`,
              },
              ...coupons.filter((c) => c.code !== cleanCode),
            ]);
            setCouponCode('');
            showToast(`Cupón ${cleanCode} creado`);
          };

          return (
            <div className="space-y-6">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <form onSubmit={handleCreateStaff} className="lg:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 space-y-3 h-fit">
                  <h3 className="font-extrabold text-slate-900">Crear Usuario y Nivel de Acceso</h3>
                  <input type="text" placeholder="Nombre del empleado *" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" required />
                  <select value={role} onChange={(e) => setRole(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold">
                    {Object.values(ROLE_DEFINITIONS).map((r) => (
                      <option key={r.key} value={r.key}>{r.label}</option>
                    ))}
                  </select>
                  <p className="text-[11px] text-slate-500">{ROLE_DEFINITIONS[role]?.description}</p>
                  <input type="text" placeholder="PIN o Clave de Acceso *" value={pin} onChange={(e) => setPin(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" required />
                  <button type="submit" className="w-full py-2.5 bg-slate-900 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                    Crear Credencial
                  </button>
                </form>

                <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                  <h3 className="font-extrabold text-slate-900">Usuarios con Acceso al Sistema</h3>
                  {staffUsers.map((u) => {
                    const rDef = ROLE_DEFINITIONS[u.role] || ROLE_DEFINITIONS.CASHIER;
                    return (
                      <div key={u.id} className="p-4 rounded-2xl border border-slate-200 flex items-center justify-between">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-extrabold text-sm text-slate-900">{u.name}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${rDef.badgeColor}`}>{rDef.label}</span>
                          </div>
                          <p className="text-xs text-slate-500 mt-0.5">PIN: <strong>{u.pin}</strong> • {rDef.description}</p>
                        </div>
                        {u.id !== 'staff-owner' && (
                          <button
                            type="button"
                            onClick={() => setStaffUsers(staffUsers.filter((x) => x.id !== u.id))}
                            className="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold cursor-pointer"
                          >
                            Eliminar
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* GESTOR DE CUPONES PROMOCIONALES */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <form onSubmit={handleCreateCoupon} className="lg:col-span-4 bg-white p-5 rounded-3xl border border-slate-200 space-y-3 h-fit">
                  <h3 className="font-extrabold text-slate-900">Crear Cupón de Descuento</h3>
                  <input type="text" placeholder="Código (Ej: CLIENTEVIP15)" value={couponCode} onChange={(e) => setCouponCode(e.target.value.toUpperCase())} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold uppercase" required />
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">% Descuento</label>
                      <input type="number" min="1" max="90" value={couponPct} onChange={(e) => setCouponPct(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600 block mb-1">Compra Mín. ($)</label>
                      <input type="number" min="0" step="0.5" value={couponMin} onChange={(e) => setCouponMin(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">
                    + Activar Cupón
                  </button>
                </form>

                <div className="lg:col-span-8 bg-white p-5 rounded-3xl border border-slate-200 space-y-3">
                  <h3 className="font-extrabold text-slate-900">Cupones Promocionales Activos</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {coupons.map((cp) => (
                      <div key={cp.code} className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between text-xs">
                        <div>
                          <span className="font-black text-emerald-700 text-sm">{cp.code}</span>
                          <p className="text-slate-600">{cp.discountPercent}% desc. • Mínimo: {formatUsd(cp.minOrderUsd)}</p>
                        </div>
                        <button
                          type="button"
                          onClick={() => setCoupons && setCoupons(coupons.filter((c) => c.code !== cp.code))}
                          className="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-xl font-bold cursor-pointer"
                        >
                          Borrar
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
