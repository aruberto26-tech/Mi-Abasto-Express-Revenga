        // ============================================================================
        // UTILIDADES
        // ============================================================================
        const formatUsd = (val) => `$${Number(val || 0).toFixed(2)}`;
        const formatBs = (val) => `Bs. ${Number(val || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        function compressImageFile(file, maxWidth = 420, quality = 0.78) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
            reader.onload = (event) => {
              const img = new Image();
              img.onerror = () => reject(new Error('Imagen no válida'));
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          });
        }

        function useLocalStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(() => {
            try {
              const item = window.localStorage.getItem(key);
              return item ? JSON.parse(item) : initialValue;
            } catch (error) {
              return initialValue;
            }
          });

          const setValue = (value) => {
            try {
              const valueToStore = value instanceof Function ? value(storedValue) : value;
              setStoredValue(valueToStore);
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (error) {
              console.error(error);
            }
          };

          return [storedValue, setValue];
        }

        // ============================================================================
        // COMPONENTE PRINCIPAL
        // ============================================================================
        function App() {
          const [settings, setSettings] = useLocalStorage('abasto_settings_v2', INITIAL_SETTINGS);
          const [departments, setDepartments] = useLocalStorage('abasto_departments_v2', INITIAL_DEPARTMENTS);
          const [products, setProducts] = useLocalStorage('abasto_products_v2', INITIAL_PRODUCTS);
          const [customers, setCustomers] = useLocalStorage('abasto_customers_v2', INITIAL_CUSTOMERS);
          const [sales, setSales] = useLocalStorage('abasto_sales_v2', INITIAL_SALES);
          const [cashMovements, setCashMovements] = useLocalStorage('abasto_cash_v2', INITIAL_CASH_MOVEMENTS);
          const [currentUserCi, setCurrentUserCi] = useLocalStorage('abasto_current_user_ci_v2', null);

          const [appMode, setAppMode] = useState('STORE');
          const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
          const [showPinModal, setShowPinModal] = useState(false);
          const [pinInput, setPinInput] = useState('');
          const [showPinText, setShowPinText] = useState(false);
          const [pinError, setPinError] = useState('');

          const [selectedDepartment, setSelectedDepartment] = useState('Todos');
          const [searchQuery, setSearchQuery] = useState('');
          const [cart, setCart] = useLocalStorage('abasto_cart_v2', []);
          const [onlinePaymentMethod, setOnlinePaymentMethod] = useState('Pago Móvil Bs.');
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
          const [isSupportModalOpen, setIsSupportModalOpen] = useState(false);
          const [checkoutAfterAuth, setCheckoutAfterAuth] = useState(false);
          const [whatsappConfirmModal, setWhatsappConfirmModal] = useState(null);
          const [copiedMsg, setCopiedMsg] = useState(false);

          const brandPrimary = settings.primaryColor || '#059669';
          const brandAccent = settings.accentColor || '#f59e0b';
          const brandHeader = settings.headerColor || '#064e3b';

          const [toast, setToast] = useState(null);
          const showToast = (message, type = 'success') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3500);
          };

          const currentUser = useMemo(() => customers.find((c) => c.ci === currentUserCi) || null, [customers, currentUserCi]);

          const enrichedCart = useMemo(() => {
            return cart.map((item) => {
              const product = products.find((p) => p.id === item.productId);
              if (!product) return null;
              const isWholesale = item.qty >= product.wholesaleMinQty;
              const appliedPriceUsd = isWholesale ? product.wholesalePrice : product.retailPrice;
              const regularTotalUsd = product.retailPrice * item.qty;
              const lineTotalUsd = appliedPriceUsd * item.qty;
              return {
                ...item,
                product,
                isWholesale,
                appliedPriceUsd,
                lineTotalUsd,
                savingsUsd: regularTotalUsd - lineTotalUsd,
                missingForWholesale: isWholesale ? 0 : product.wholesaleMinQty - item.qty,
              };
            }).filter(Boolean);
          }, [cart, products]);

          const cartSummary = useMemo(() => {
            const subtotalUsd = enrichedCart.reduce((acc, item) => acc + item.lineTotalUsd, 0);
            const totalSavingsUsd = enrichedCart.reduce((acc, item) => acc + item.savingsUsd, 0);
            const totalItemsCount = enrichedCart.reduce((acc, item) => acc + item.qty, 0);
            const qualifiesFreeDelivery = subtotalUsd >= settings.freeDeliveryThreshold;
            const deliveryUsd = subtotalUsd === 0 ? 0 : qualifiesFreeDelivery ? 0 : Number(settings.deliveryFee);
            const missingForFreeDelivery = Math.max(0, settings.freeDeliveryThreshold - subtotalUsd);
            const totalUsd = subtotalUsd + deliveryUsd;
            const totalBs = totalUsd * settings.exchangeRate;
            return { subtotalUsd, totalSavingsUsd, totalItemsCount, qualifiesFreeDelivery, deliveryUsd, missingForFreeDelivery, totalUsd, totalBs };
          }, [enrichedCart, settings]);

          const addToCart = (productId, delta = 1) => {
            const product = products.find((p) => p.id === productId);
            if (!product) return;
            setCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              const newQty = (existing ? existing.qty : 0) + delta;
              if (newQty <= 0) return prev.filter((i) => i.productId !== productId);
              if (newQty > product.stock) {
                showToast(`Solo hay ${product.stock} unidades disponibles de ${product.name}`, 'warning');
                return prev;
              }
              return existing ? prev.map((i) => (i.productId === productId ? { ...i, qty: newQty } : i)) : [...prev, { productId, qty: newQty }];
            });
          };

          const setCartQtyDirect = (productId, qty) => {
            const product = products.find((p) => p.id === productId);
            if (!product) return;
            if (qty <= 0) {
              setCart((prev) => prev.filter((i) => i.productId !== productId));
              return;
            }
            const clampedQty = Math.min(qty, product.stock);
            setCart((prev) => {
              const existing = prev.find((i) => i.productId === productId);
              return existing ? prev.map((i) => (i.productId === productId ? { ...i, qty: clampedQty } : i)) : [...prev, { productId, qty: clampedQty }];
            });
          };

          const handleInitiateCheckout = () => {
            if (enrichedCart.length === 0) return;
            if (!currentUser) {
              setCheckoutAfterAuth(true);
              setIsCartOpen(false);
              setIsProfileModalOpen(true);
              showToast('Por favor regístrate o inicia sesión para completar tu pedido', 'info');
              return;
            }
            completeOnlineOrder(currentUser);
          };

          const completeOnlineOrder = (customer) => {
            for (const item of enrichedCart) {
              if (item.qty > item.product.stock) {
                showToast(`Stock insuficiente para ${item.product.name}`, 'error');
                return;
              }
            }
            const totalCostUsd = enrichedCart.reduce((acc, item) => acc + item.product.costPrice * item.qty, 0);
            const isCashPayment = onlinePaymentMethod.toLowerCase().includes('efectivo');
            const dispatchRuleText = isCashPayment
              ? 'Pago en Efectivo: Despacho sujeto a modalidad contra-entrega / verificación en efectivo.'
              : 'Pago Digital: El delivery sale inmediatamente tras confirmar el pago.';

            const newSale = {
              id: `VTA-${Math.floor(1000 + Math.random() * 9000)}`,
              date: new Date().toISOString(),
              channel: 'ONLINE',
              customerCi: customer.ci,
              customerName: `${customer.firstName} ${customer.lastName}`,
              customerPhone: customer.phone,
              customerAddress: customer.address,
              paymentMethod: onlinePaymentMethod,
              items: enrichedCart.map((i) => ({ productId: i.product.id, name: i.product.name, qty: i.qty, unitPrice: i.appliedPriceUsd, costPrice: i.product.costPrice, isWholesale: i.isWholesale })),
              subtotalUsd: cartSummary.subtotalUsd,
              deliveryUsd: cartSummary.deliveryUsd,
              totalUsd: cartSummary.totalUsd,
              totalCostUsd,
              exchangeRate: settings.exchangeRate,
              totalBs: cartSummary.totalBs,
            };

            setProducts((prevProducts) => prevProducts.map((p) => {
              const bought = enrichedCart.find((i) => i.productId === p.id);
              return bought ? { ...p, stock: Math.max(0, p.stock - bought.qty) } : p;
            }));

            setSales((prev) => [newSale, ...prev]);
            setCashMovements((prev) => [{
              id: `MOV-${Date.now()}`,
              date: new Date().toISOString(),
              type: 'IN',
              category: `Venta Online (${onlinePaymentMethod})`,
              description: `Pedido ${newSale.id} - ${newSale.customerName} (${newSale.customerCi})`,
              amountUsd: newSale.totalUsd,
              currencyUsed: onlinePaymentMethod.includes('Bs') ? 'BS' : 'USD',
            }, ...prev]);

            const itemsText = enrichedCart.map((i) => `• ${i.qty}x ${i.product.name} (${i.isWholesale ? 'Mayor' : 'Detal'}) = ${formatUsd(i.lineTotalUsd)}`).join('\n');
            const waMessage =
              `🛒 *NUEVO PEDIDO - ${settings.storeName.toUpperCase()}*\n` +
              `📋 *Pedido N°:* ${newSale.id}\n\n` +
              `👤 *DATOS DEL CLIENTE:*\n` +
              `• *Nombre:* ${customer.firstName} ${customer.lastName}\n` +
              `• *Cédula (CI):* ${customer.ci}\n` +
              `• *Teléfono:* ${customer.phone}\n` +
              `• *Ubicación:* ${customer.address}\n\n` +
              `🛍️ *DETALLE DE LA COMPRA:*\n${itemsText}\n\n` +
              `💳 *Método de Pago:* ${onlinePaymentMethod}\n` +
              `🚚 *Delivery:* ${cartSummary.deliveryUsd === 0 ? 'GRATIS 🎉' : formatUsd(cartSummary.deliveryUsd)}\n` +
              `📦 *Condición de Despacho:* ${dispatchRuleText}\n\n` +
              `💵 *TOTAL EN DÓLARES:* ${formatUsd(cartSummary.totalUsd)}\n` +
              `🇻🇪 *TOTAL EN BOLÍVARES:* ${formatBs(cartSummary.totalBs)} _(Tasa: Bs. ${Number(settings.exchangeRate).toFixed(2)})_\n\n` +
              `¡Hola! Envío mi pedido para coordinar el pago y la entrega.`;

            const cleanPhone = settings.whatsappNumber.replace(/\D/g, '');
            const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(waMessage)}`;

            setCart([]);
            setIsCartOpen(false);
            setWhatsappConfirmModal({ sale: newSale, message: waMessage, url: waUrl });
            showToast('¡Pedido registrado con éxito!');
          };

          const handleAdminButtonClick = () => {
            if (appMode === 'ADMIN') { setAppMode('STORE'); return; }
            if (isAdminUnlocked) setAppMode('ADMIN');
            else { setPinInput(''); setShowPinText(false); setPinError(''); setShowPinModal(true); }
          };

          const handleVerifyPin = (e) => {
            e.preventDefault();
            if (pinInput === settings.adminPin) {
              setIsAdminUnlocked(true);
              setShowPinModal(false);
              setAppMode('ADMIN');
              showToast('Bienvenido al Panel Administrativo');
            } else {
              setPinError('Contraseña / PIN incorrecto. Intenta nuevamente.');
            }
          };

          const storeDepartmentList = useMemo(() => [
            { id: 'all', name: 'Todos', emoji: '🏪' },
            { id: 'offers', name: 'Ofertas y Promociones', emoji: '🔥' },
            ...departments,
          ], [departments]);

          const filteredProducts = useMemo(() => {
            return products.filter((p) => {
              const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.department.toLowerCase().includes(searchQuery.toLowerCase());
              if (!matchesSearch) return false;
              if (selectedDepartment === 'Todos') return true;
              if (selectedDepartment === 'Ofertas y Promociones') return p.isOffer;
              return p.department === selectedDepartment;
            });
          }, [products, searchQuery, selectedDepartment]);

          const lowStockCount = useMemo(() => products.filter((p) => p.stock <= 10).length, [products]);

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
              {toast && (
                <div className="fixed bottom-20 right-5 z-50 animate-bounce">
                  <div style={toast.type === 'success' ? { backgroundColor: brandPrimary } : undefined}
                    className={`flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium ${toast.type === 'error' ? 'bg-red-600 text-white' : toast.type === 'warning' ? 'bg-amber-500 text-white' : toast.type === 'info' ? 'bg-slate-800 text-white' : 'text-white'}`}>
                    <CheckCircle2 className="w-5 h-5 shrink-0" />
                    <span>{toast.message}</span>
                  </div>
                </div>
              )}

              <header className="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
                <div style={{ backgroundColor: brandHeader }} className="text-white text-xs py-1.5 px-4 transition-colors">
                  <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-3 sm:gap-4">
                      <span className="inline-flex items-center gap-1.5 font-semibold bg-black/25 px-2.5 py-0.5 rounded-full border border-white/15">
                        <DollarSign className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                        Tasa del día: <strong style={{ color: brandAccent }}>Bs. {Number(settings.exchangeRate).toFixed(2)}</strong>
                      </span>
                      <span className="hidden md:inline-flex items-center gap-1 text-white/90">
                        <Truck className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                        Delivery GRATIS desde {formatUsd(settings.freeDeliveryThreshold)}
                      </span>
                    </div>

                    <div className="flex items-center gap-2">
                      {appMode === 'STORE' && (
                        <button onClick={() => setIsSupportModalOpen(true)} className="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full font-semibold bg-white/15 hover:bg-white/25 text-white border border-white/20 transition cursor-pointer">
                          <Headphones className="w-3.5 h-3.5" style={{ color: brandAccent }} />
                          <span>Atención al Cliente</span>
                        </button>
                      )}
                      <button onClick={handleAdminButtonClick} style={appMode === 'ADMIN' ? { backgroundColor: brandAccent, color: '#0f172a' } : undefined}

        // ============================================================================
        // SUBCOMPONENTES COMPACTOS
        // ============================================================================
        function CustomerSupportModal({ onClose, settings, currentUser, customers, setCustomers, setCurrentUserCi, showToast }) {
          const [reason, setReason] = useState('Consulta General sobre Productos');
          const [customMessage, setCustomMessage] = useState('');
          const [guestData, setGuestData] = useState({ firstName: '', lastName: '', ci: '', phone: '', address: '' });

          const handleSend = (e) => {
            e.preventDefault();
            let profile = currentUser;
            if (!profile) {
              const formattedCi = `V-${guestData.ci.replace(/\D/g, '')}`;
              profile = { ...guestData, ci: formattedCi, photo: null, createdAt: new Date().toISOString() };
              setCustomers((prev) => [profile, ...prev]);
              setCurrentUserCi(formattedCi);
            }
            const text = `💬 *ATENCIÓN AL CLIENTE - ${settings.storeName.toUpperCase()}*\n👤 *Cliente:* ${profile.firstName} ${profile.lastName} (${profile.ci})\n📞 *Tel:* ${profile.phone}\n📌 *Motivo:* ${reason}\n📝 *Mensaje:* ${customMessage || 'Necesito atención'}`;
            window.open(`https://wa.me/${settings.whatsappNumber.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`, '_blank');
            onClose();
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center"><h3 className="font-extrabold text-lg">Atención al Cliente</h3><button onClick={onClose}>✕</button></div>
                <form onSubmit={handleSend} className="space-y-3 text-xs">
                  {!currentUser && (
                    <>
                      <input type="text" required placeholder="Nombre *" value={guestData.firstName} onChange={(e) => setGuestData({ ...guestData, firstName: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                      <input type="text" required placeholder="Apellido *" value={guestData.lastName} onChange={(e) => setGuestData({ ...guestData, lastName: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                      <input type="text" required placeholder="Cédula *" value={guestData.ci} onChange={(e) => setGuestData({ ...guestData, ci: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                      <input type="text" required placeholder="Teléfono *" value={guestData.phone} onChange={(e) => setGuestData({ ...guestData, phone: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                      <input type="text" required placeholder="Dirección *" value={guestData.address} onChange={(e) => setGuestData({ ...guestData, address: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                    </>
                  )}
                  <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-full p-2.5 border rounded-xl font-semibold">
                    <option value="Consulta General sobre Productos">Consulta General sobre Productos</option>
                    <option value="Estado de mi Pedido / Delivery">Estado de mi Pedido / Delivery</option>
                    <option value="Compra al Mayor">Compra al Mayor</option>
                  </select>
                  <textarea rows={2} placeholder="Tu mensaje..." value={customMessage} onChange={(e) => setCustomMessage(e.target.value)} className="w-full p-2.5 border rounded-xl" />
                  <button type="submit" style={{ backgroundColor: settings.primaryColor }} className="w-full py-3 rounded-xl text-white font-bold">Escribir al WhatsApp</button>
                </form>
              </div>
            </div>
          );
        }

        function CustomerProfileModal({ onClose, currentUser, customers, setCustomers, setCurrentUserCi, checkoutAfterAuth, onAuthSuccessAndCheckout, showToast, brandPrimary }) {
          const [formData, setFormData] = useState({
            firstName: currentUser?.firstName || '', lastName: currentUser?.lastName || '',
            ci: currentUser?.ci || '', phone: currentUser?.phone || '', address: currentUser?.address || '', photo: currentUser?.photo || null
          });

          const handleSave = (e) => {
            e.preventDefault();
            const cleanCi = formData.ci.trim().toUpperCase();
            const formattedCi = /^[VEJ]-/.test(cleanCi) ? cleanCi : `V-${cleanCi.replace(/\D/g, '')}`;
            const record = { ...formData, ci: formattedCi, createdAt: new Date().toISOString() };
            setCustomers((prev) => [record, ...prev.filter((c) => c.ci !== formattedCi)]);
            setCurrentUserCi(formattedCi);
            showToast('Perfil guardado');
            if (checkoutAfterAuth) onAuthSuccessAndCheckout(record);
            else onClose();
          };

          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center"><h3 className="font-extrabold text-lg">Datos del Cliente</h3><button onClick={onClose}>✕</button></div>
                <form onSubmit={handleSave} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Nombre *" value={formData.firstName} onChange={(e) => setFormData({ ...formData, firstName: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                  <input type="text" required placeholder="Apellido *" value={formData.lastName} onChange={(e) => setFormData({ ...formData, lastName: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                  <input type="text" required placeholder="Cédula (Ej: V-12345678) *" value={formData.ci} onChange={(e) => setFormData({ ...formData, ci: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                  <input type="tel" required placeholder="Teléfono *" value={formData.phone} onChange={(e) => setFormData({ ...formData, phone: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                  <textarea rows={2} required placeholder="Dirección Exacta *" value={formData.address} onChange={(e) => setFormData({ ...formData, address: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                  <button type="submit" style={{ backgroundColor: brandPrimary }} className="w-full py-3 rounded-xl text-white font-bold">Guardar Datos</button>
                </form>
              </div>
            </div>
          );
        }

        function AdminPanel({ settings, setSettings, departments, setDepartments, products, setProducts, customers, sales, setSales, cashMovements, setCashMovements, showToast }) {
          const [tab, setTab] = useState('INVENTORY');
          const [editProd, setEditProd] = useState(null);
          const [newDeptName, setNewDeptName] = useState('');
          const [settingsForm, setSettingsForm] = useState(settings);
          const photoRef = useRef(null);
          const logoRef = useRef(null);

          const totalSales = sales.reduce((acc, s) => acc + s.totalUsd, 0);
          const totalProfit = sales.reduce((acc, s) => acc + (s.totalUsd - (s.totalCostUsd || 0)), 0);

          const handlePhotoChange = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const compressed = await compressImageFile(file);
            setEditProd((prev) => ({ ...prev, image: compressed }));
          };

          const handleLogoChange = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const compressed = await compressImageFile(file, 300);
            setSettingsForm((prev) => ({ ...prev, storeLogo: compressed }));
          };

          const saveProduct = (e) => {
            e.preventDefault();
            const clean = {
              ...editProd,
              costPrice: Number(editProd.costPrice),
              retailPrice: Number(editProd.retailPrice),
              wholesalePrice: Number(editProd.wholesalePrice),
              wholesaleMinQty: Number(editProd.wholesaleMinQty),
              stock: Number(editProd.stock),
            };
            setProducts((prev) => prev.some((p) => p.id === clean.id) ? prev.map((p) => (p.id === clean.id ? clean : p)) : [clean, ...prev]);
            setEditProd(null);
            showToast('Producto actualizado');
          };

          return (
            <div className="max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
              <div className="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border">
                {['INVENTORY', 'STATS', 'SETTINGS'].map((t) => (
                  <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${tab === t ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>
                    {t === 'INVENTORY' ? 'Inventario y Fotos' : t === 'STATS' ? 'Ganancias y Ventas' : 'Marca, Colores y Tasa'}
                  </button>
                ))}
              </div>

              {tab === 'INVENTORY' && (
                <div className="bg-white p-5 rounded-3xl border space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="font-extrabold text-lg">Inventario y Precios</h2>
                    <button onClick={() => setEditProd({ id: `prod-${Date.now()}`, name: '', department: departments[0]?.name || 'Víveres', emoji: '📦', image: null, costPrice: 1, retailPrice: 1.5, wholesalePrice: 1.2, wholesaleMinQty: 5, stock: 20, isOffer: false, unit: 'Unidad' })}
                      className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">+ Nuevo Producto</button>
                  </div>

                  <div className="flex gap-2">
                    <input type="text" placeholder="Nuevo departamento..." value={newDeptName} onChange={(e) => setNewDeptName(e.target.value)} className="px-3 py-2 border rounded-xl text-xs" />
                    <button onClick={() => { if (!newDeptName.trim()) return; setDepartments([...departments, { id: `d-${Date.now()}`, name: newDeptName.trim(), emoji: '📦' }]); setNewDeptName(''); showToast('Departamento agregado'); }}
                      className="px-3 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">+ Agregar Rubro</button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead><tr className="border-b bg-slate-50"><th className="p-2">Producto</th><th className="p-2">Detal</th><th className="p-2">Mayor</th><th className="p-2">Stock</th><th className="p-2">Acción</th></tr></thead>
                      <tbody>
                        {products.map((p) => (
                          <tr key={p.id} className="border-b">
                            <td className="p-2 font-bold flex items-center gap-2">
                              {p.image ? <img src={p.image} className="w-8 h-8 rounded object-cover" /> : <span>{p.emoji}</span>} {p.name}
                            </td>
                            <td className="p-2">{formatUsd(p.retailPrice)}</td>
                            <td className="p-2 text-emerald-700 font-bold">{formatUsd(p.wholesalePrice)}</td>
                            <td className="p-2">{p.stock}</td>
                            <td className="p-2"><button onClick={() => setEditProd(p)} className="px-2 py-1 bg-slate-100 rounded font-bold">Editar</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {tab === 'STATS' && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-white p-6 rounded-3xl border">
                    <p className="text-xs font-bold text-slate-500">VENTAS TOTALES</p>
                    <p className="text-3xl font-black mt-1">{formatUsd(totalSales)}</p>
                  </div>
                  <div className="bg-emerald-700 text-white p-6 rounded-3xl">
                    <p className="text-xs font-bold">GANANCIA NETA</p>
                    <p className="text-3xl font-black text-amber-300 mt-1">{formatUsd(totalProfit)}</p>
                  </div>
                </div>
              )}

              {tab === 'SETTINGS' && (
                <form onSubmit={(e) => { e.preventDefault(); setSettings({ ...settingsForm, exchangeRate: Number(settingsForm.exchangeRate) }); showToast('Configuración guardada'); }} className="bg-white p-6 rounded-3xl border max-w-xl space-y-4 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Logo del Negocio</label>
                    <input ref={logoRef} type="file" accept="image/*" onChange={handleLogoChange} className="hidden" />
                    <button type="button" onClick={() => logoRef.current?.click()} className="px-3 py-2 bg-slate-900 text-white rounded-xl font-bold">Subir Logo JPG/PNG</button>
                  </div>
                  <div><label className="font-bold block mb-1">Nombre Tienda</label><input type="text" value={settingsForm.storeName} onChange={(e) => setSettingsForm({ ...settingsForm, storeName: e.target.value })} className="w-full p-2.5 border rounded-xl" /></div>
                  <div className="grid grid-cols-3 gap-2">
                    <div><label className="font-bold block">Color Primario</label><input type="color" value={settingsForm.primaryColor} onChange={(e) => setSettingsForm({ ...settingsForm, primaryColor: e.target.value })} /></div>
                    <div><label className="font-bold block">Color Acento</label><input type="color" value={settingsForm.accentColor} onChange={(e) => setSettingsForm({ ...settingsForm, accentColor: e.target.value })} /></div>
                    <div><label className="font-bold block">Color Barra</label><input type="color" value={settingsForm.headerColor} onChange={(e) => setSettingsForm({ ...settingsForm, headerColor: e.target.value })} /></div>
                  </div>
                  <div><label className="font-bold block mb-1">Tasa Bs. / USD</label><input type="number" step="0.01" value={settingsForm.exchangeRate} onChange={(e) => setSettingsForm({ ...settingsForm, exchangeRate: e.target.value })} className="w-full p-2.5 border rounded-xl font-bold" /></div>
                  <div><label className="font-bold block mb-1">WhatsApp</label><input type="text" value={settingsForm.whatsappNumber} onChange={(e) => setSettingsForm({ ...settingsForm, whatsappNumber: e.target.value })} className="w-full p-2.5 border rounded-xl" /></div>
                  <div><label className="font-bold block mb-1">PIN Admin</label><input type="text" value={settingsForm.adminPin} onChange={(e) => setSettingsForm({ ...settingsForm, adminPin: e.target.value })} className="w-full p-2.5 border rounded-xl font-bold" /></div>
                  <button type="submit" className="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold">Guardar Cambios</button>
                </form>
              )}

              {editProd && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                  <form onSubmit={saveProduct} className="bg-white rounded-3xl max-w-md w-full p-6 space-y-3 text-xs">
                    <h3 className="font-extrabold text-base">Editar Producto</h3>
                    <input ref={photoRef} type="file" accept="image/*" onChange={handlePhotoChange} className="hidden" />
                    <button type="button" onClick={() => photoRef.current?.click()} className="px-3 py-2 bg-emerald-600 text-white rounded-xl font-bold">Subir Foto JPG</button>
                    <input type="text" required placeholder="Nombre" value={editProd.name} onChange={(e) => setEditProd({ ...editProd, name: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                    <select value={editProd.department} onChange={(e) => setEditProd({ ...editProd, department: e.target.value })} className="w-full p-2.5 border rounded-xl">
                      {departments.map((d) => <option key={d.id} value={d.name}>{d.name}</option>)}
                    </select>
                    <div className="grid grid-cols-3 gap-2">
                      <div><label>Costo ($)</label><input type="number" step="0.01" value={editProd.costPrice} onChange={(e) => setEditProd({ ...editProd, costPrice: e.target.value })} className="w-full p-2 border rounded-xl" /></div>
                      <div><label>Detal ($)</label><input type="number" step="0.01" value={editProd.retailPrice} onChange={(e) => setEditProd({ ...editProd, retailPrice: e.target.value })} className="w-full p-2 border rounded-xl" /></div>
                      <div><label>Mayor ($)</label><input type="number" step="0.01" value={editProd.wholesalePrice} onChange={(e) => setEditProd({ ...editProd, wholesalePrice: e.target.value })} className="w-full p-2 border rounded-xl" /></div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label>Mín. Mayor</label><input type="number" value={editProd.wholesaleMinQty} onChange={(e) => setEditProd({ ...editProd, wholesaleMinQty: e.target.value })} className="w-full p-2 border rounded-xl" /></div>
                      <div><label>Stock</label><input type="number" value={editProd.stock} onChange={(e) => setEditProd({ ...editProd, stock: e.target.value })} className="w-full p-2 border rounded-xl" /></div>
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setEditProd(null)} className="px-4 py-2 border rounded-xl">Cancelar</button>
                      <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold">Guardar</button>
                    </div>
                  </form>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
